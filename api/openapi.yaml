      security: [{ bearer: [] }]
      responses:
        "200":
          description: Productor encontrado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Productor" }
              example:
                id: cd3b83ce-114a-5624-bde0-0c482a535db2
                tipo_persona: natural
                tipo_documento: CC
                numero_documento: "74852369"
                representante_legal: null
                nombre_completo: Hernando Rincón Barrera
                departamento: Casanare
                municipio: Yopal
                vereda: La Guafilla
                telefono: "3124587710"
                correo: hernando.rincon@correo.co
                documento_verificado: true
                acepta_datos_en: "2026-09-10T09:00:00-05:00"
                creado_en: "2026-09-10T09:00:00-05:00"
                actualizado_en: "2026-09-10T09:00:00-05:00"
        "400": { $ref: "#/components/responses/PeticionInvalida" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/Prohibido" }
        "404": { $ref: "#/components/responses/NoEncontrado" }
    patch:
      tags: [Productores]
      operationId: actualizarProductor
      summary: Modifica datos de un productor (el propio, o cualquiera si es administrador)
      description: |
        Solo un administrador puede marcar `documento_verificado`. Un documento verificado ya no lo puede cambiar
        el productor. Si el productor tiene cuenta, el nombre y el correo se actualizan también en la cuenta.
