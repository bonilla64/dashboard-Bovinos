                          - id: 9f2a4b6c-8d0e-5f3a-b5c7-d9e1f3a5b7c9
                            simulacion_id: 5d2a9c1e-0b7f-5e3a-9c44-1f6e8d2a7b90
                            destino_id: acca0ef8-f855-5505-b81b-25833e792ff1
