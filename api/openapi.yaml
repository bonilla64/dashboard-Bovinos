openapi: 3.1.0
info:
  title: API del Simulador de Destinos Ganaderos desde Yopal
  version: 0.4.1
  summary: Compara destinos de venta de un lote de ganado combinando precio por kilo, ruta, flete, peajes, comisión y merma.
  description: |
    Contrato de la API del proyecto (Entrega 3, Tecnologías Web 2026-B, Unitrópico).
    Este archivo es la fuente de verdad: la API lo carga al arrancar, valida cada petición
    con sus esquemas y se niega a iniciar si falta implementar alguna operación.

    Reglas comunes a toda la API:

    - Todas las fechas y horas se expresan en ISO 8601 con zona horaria.
    - Los valores monetarios son pesos colombianos (COP) enteros, sin decimales.
    - Las geometrías viajan en GeoJSON con coordenadas `[longitud, latitud]` (EPSG:4326).
    - Los listados grandes son paginados con `pagina` y `por_pagina` y devuelven `datos` + metadatos.
    - Todo error, sin excepción, responde con el esquema `Error`.
    - Las operaciones marcadas con candado exigen `Authorization: Bearer <token>`, obtenido en `POST /auth/ingreso`.
      La extensión `x-roles` indica qué roles pueden usarlas; si no aparece, basta con haber iniciado sesión.
    - Un productor solo ve y modifica sus propios lotes, fincas y simulaciones (autorización por objeto).
    - Cada petición con token vuelve a consultar la cuenta: si fue suspendida o eliminada responde 401 aunque el
      token no haya vencido, y si cambió de rol se aplica el rol nuevo. Una cuenta con contraseña temporal solo
      puede usar `GET /auth/yo` y `POST /auth/contrasena` hasta cambiarla (403).
    - Integridad: lo que tiene datos asociados no se borra sino que se desactiva (cuentas suspendidas, destinos y
      fincas inactivos, lotes vendidos), y siempre queda al menos un administrador activo.
    - Vigencia de precios: cada resultado indica la fecha y la antigüedad del precio usado. Con más de 7 días
      se agrega una advertencia; con más de 30 días el destino no se compara (422). Los precios se cargan
      desde los reportes de Fedegán con `POST /precios/importacion`.

    Fórmula que aplica `POST /simulaciones` para cada destino:

    ```
    camiones            = techo(cantidad_animales / capacidad_camion)
    peso_vendido_kg     = peso_total_kg × (1 − merma_pct / 100)
    ingreso_bruto_cop   = peso_vendido_kg × precio_kg_cop
    comision_cop        = ingreso_bruto_cop × comision_pct / 100
    flete_cop           = distancia_km × flete_km_cop × factor_dificultad × camiones
    peajes_cop          = peajes_ruta × camiones   (0 si flete_incluye_peajes)
    costo_logistico_cop = flete_cop + peajes_cop + comision_cop
    utilidad_neta_cop   = ingreso_bruto_cop − costo_logistico_cop
    ```
  license:
    name: MIT
    identifier: MIT
servers:
  - url: /api/v1
    description: Este mismo servidor (el que muestra esta documentación, local o publicado)
  - url: http://localhost:3000/api/v1
    description: Servidor local (docker compose up)
security: []
tags:
  - name: Autenticación
    description: Registro, inicio de sesión y usuario actual.
  - name: Usuarios
    description: Administración de cuentas (solo administradores).
  - name: Productores
    description: Personas naturales o empresas que registran lotes para vender.
  - name: Fincas
    description: Predios de cada productor, con municipio, vereda y ubicación.
  - name: Lotes
    description: Grupos de animales que se quieren comercializar.
  - name: Destinos
    description: Venta en finca, subastas, ferias, frigoríficos y plantas de beneficio.
  - name: Precios
    description: Precio de compra por kilogramo en cada destino, por categoría y fecha.
  - name: Rutas
    description: Trayecto vial desde el origen (Yopal) hasta cada destino, con su geometría.
  - name: Simulaciones
    description: Cálculo comparativo de utilidad de un lote en varios destinos.
  - name: Administración
    description: Resumen del sistema y bitácora de cambios (solo administradores).
  - name: Sistema
    description: Estado del servicio.

paths:
  /salud:
    get:
      tags: [Sistema]
      operationId: verificarSalud
      summary: Indica si la API y la base de datos responden
      responses:
        "200":
          description: Servicio disponible
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Salud" }
              example: { estado: ok, base_datos: ok, version: 0.3.0 }
        "503": { $ref: "#/components/responses/NoDisponible" }

  /auth/registro:
    post:
      tags: [Autenticación]
      operationId: registrarUsuario
      summary: Crea una cuenta de productor (persona o empresa)
      description: |
        Crea en una sola transacción el usuario (rol `productor`) y su ficha de productor. Una persona se identifica
        con CC o CE; una empresa con NIT (se comprueba el dígito de verificación) y debe indicar su representante
        legal. El documento y el correo no se pueden repetir. Exige aceptar el tratamiento de datos personales
        (Ley 1581 de 2012). La contraseña se guarda cifrada con bcrypt.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegistroEntrada" }
            example:
              tipo_persona: natural
              tipo_documento: CC
              numero_documento: "1118556432"
              nombre_completo: Rosalba Guío Vargas
              correo: rosalba.guio@correo.co
              contrasena: sabana-tauramena-2026
              municipio: Tauramena
              vereda: Cusiana
              telefono: "3114409862"
              acepta_tratamiento_datos: true
      responses:
        "201":
          description: Cuenta creada; ya puede iniciar sesión
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sesion" }
        "400": { $ref: "#/components/responses/PeticionInvalida" }
        "409":
          description: Ya existe una cuenta con ese correo o ese documento
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                codigo: CONFLICTO
                mensaje: Ya existe una cuenta con ese correo.
                detalles:
                  - campo: correo
                    problema: Correo ya registrado.
        "422": { $ref: "#/components/responses/ValidacionFallida" }

  /auth/ingreso:
    post:
      tags: [Autenticación]
      operationId: iniciarSesion
      summary: Inicia sesión y entrega un token
      description: |
        Limitado a 10 intentos por minuto por dirección IP. Una cuenta suspendida recibe 403. Si la respuesta trae
        `usuario.debe_cambiar_contrasena: true`, la cuenta debe cambiar su contraseña antes de seguir.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IngresoEntrada" }
            example:
              correo: hernando.rincon@correo.co
              contrasena: la-contrasena-de-demostracion
      responses:
        "200":
          description: Sesión iniciada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sesion" }
              example:
                token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIuLi4ifQ.firma
                tipo: Bearer
                expira_en: 28800
                usuario:
                  id: 3a6f1c52-8d1e-4b8a-9c3e-2a7f5b9d1e01
                  nombre_completo: Hernando Rincón Barrera
                  correo: hernando.rincon@correo.co
                  rol: productor
                  productor_id: cd3b83ce-114a-5624-bde0-0c482a535db2
                  activo: true
                  debe_cambiar_contrasena: false
                  ultimo_ingreso: "2026-10-18T07:40:00-05:00"
                  creado_en: "2026-09-10T09:00:00-05:00"
                  actualizado_en: "2026-09-10T09:00:00-05:00"
        "400": { $ref: "#/components/responses/PeticionInvalida" }
        "401":
          description: Correo o contraseña incorrectos
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                codigo: NO_AUTENTICADO
                mensaje: Correo o contraseña incorrectos.
                detalles: []
        "403":
          description: Cuenta suspendida
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/ValidacionFallida" }
        "429": { $ref: "#/components/responses/DemasiadasSolicitudes" }

  /auth/yo:
    get:
      tags: [Autenticación]
      operationId: obtenerUsuarioActual
      summary: Datos del usuario de la sesión, con su ficha de productor
      security: [{ bearer: [] }]
      responses:
        "200":
          description: Usuario actual
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UsuarioDetalle" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
    patch:
      tags: [Autenticación]
      operationId: actualizarPerfil
      summary: Actualiza los datos de la propia cuenta y su ficha de productor
      description: |
        El nombre y el correo se cambian a la vez en la cuenta y en la ficha. El documento solo se puede cambiar
        mientras el administrador no lo haya marcado como verificado.
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PerfilCambios" }
            example: { telefono: "3124587799", vereda: El Charte }
      responses:
        "200":
          description: Perfil actualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UsuarioDetalle" }
        "400": { $ref: "#/components/responses/PeticionInvalida" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "409": { $ref: "#/components/responses/Conflicto" }
        "422": { $ref: "#/components/responses/ValidacionFallida" }
    delete:
      tags: [Autenticación]
      operationId: eliminarCuenta
      summary: Elimina la propia cuenta (derecho de supresión, Ley 1581 de 2012)
      description: |
        Exige la contraseña. La cuenta se borra. Si el productor no tiene lotes, también se borran su ficha y sus
        fincas; si tiene lotes, la ficha queda anónima (sin nombre, correo, celular, documento ni vereda) y los lotes
        y simulaciones se conservan como historia del mercado. El único administrador activo no puede eliminarse (409).
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConfirmarContrasena" }
      responses:
        "204": { description: Cuenta eliminada o anonimizada }
        "400": { $ref: "#/components/responses/PeticionInvalida" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "409": { $ref: "#/components/responses/Conflicto" }
        "422": { $ref: "#/components/responses/ValidacionFallida" }

  /auth/recuperacion:
    post:
      tags: [Autenticación]
      operationId: solicitarRecuperacion
      summary: Pide al administrador una contraseña nueva («¿Olvidó su contraseña?»)
      description: |
        No necesita sesión. Si el correo y el número de documento corresponden a una cuenta de productor, queda una
        solicitud pendiente para los administradores (una sola por cuenta). La respuesta es siempre la misma, exista o
        no la cuenta, para no revelar qué correos están registrados. Limitado a 10 intentos por minuto por IP.
        Un administrador que olvidó su contraseña la pide a otro administrador.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecuperacionEntrada" }
            example: { correo: hernando.rincon@correo.co, numero_documento: "74852369" }
      responses:
        "202":
          description: Solicitud recibida (o descartada en silencio si los datos no corresponden)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Aviso" }
        "400": { $ref: "#/components/responses/PeticionInvalida" }
        "422": { $ref: "#/components/responses/ValidacionFallida" }
        "429": { $ref: "#/components/responses/DemasiadasSolicitudes" }

  /auth/contrasena:
    post:
      tags: [Autenticación]
      operationId: cambiarContrasena
      summary: Cambia la contraseña de la cuenta de la sesión
      description: Exige la contraseña actual. Si la cuenta tenía una contraseña temporal, deja de pedir el cambio.
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CambioContrasena" }
      responses:
        "204": { description: Contraseña cambiada }
        "400": { $ref: "#/components/responses/PeticionInvalida" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "422": { $ref: "#/components/responses/ValidacionFallida" }

  /usuarios:
    get:
      tags: [Usuarios]
      operationId: listarUsuarios
      summary: Lista las cuentas, con su ficha de productor
      security: [{ bearer: [] }]
      x-roles: [administrador]
      parameters:
        - $ref: "#/components/parameters/Pagina"
        - $ref: "#/components/parameters/PorPagina"
        - name: q
          in: query
          description: Busca en nombre, correo y número de documento.
          schema: { type: string, minLength: 1, maxLength: 80 }
        - name: rol
          in: query
          schema: { $ref: "#/components/schemas/Rol" }
        - name: activo
          in: query
          schema: { type: boolean }
      responses:
        "200":
          description: Página de usuarios
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListaUsuarios" }
        "400": { $ref: "#/components/responses/PeticionInvalida" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/Prohibido" }
    post:
      tags: [Usuarios]
      operationId: crearUsuario
      summary: Crea una cuenta (productor o administrador)
      description: |
        Una cuenta de productor exige los mismos datos de identidad que el registro y crea también su ficha.
        La cuenta nueva debe cambiar la contraseña la primera vez que ingrese.
      security: [{ bearer: [] }]
      x-roles: [administrador]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UsuarioEntrada" }
            example:
              rol: productor
              nombre_completo: Wilson Pérez Daza
              correo: wilson.perez@correo.co
              contrasena: temporal-2026-wp
              tipo_persona: natural
              tipo_documento: CC
              numero_documento: "1118456789"
              municipio: Trinidad
      responses:
        "201":
          description: Cuenta creada
          headers:
            Location: { $ref: "#/components/headers/Location" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UsuarioDetalle" }
        "400": { $ref: "#/components/responses/PeticionInvalida" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/Prohibido" }
        "409": { $ref: "#/components/responses/Conflicto" }
        "422": { $ref: "#/components/responses/ValidacionFallida" }

  /usuarios/{usuario_id}:
    parameters:
      - $ref: "#/components/parameters/UsuarioId"
    get:
      tags: [Usuarios]
      operationId: obtenerUsuario
      summary: Obtiene una cuenta con su ficha de productor
      security: [{ bearer: [] }]
      x-roles: [administrador]
      responses:
        "200":
          description: Cuenta encontrada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UsuarioDetalle" }
        "400": { $ref: "#/components/responses/PeticionInvalida" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/Prohibido" }
        "404": { $ref: "#/components/responses/NoEncontrado" }
    patch:
      tags: [Usuarios]
      operationId: actualizarUsuario
      summary: Cambia nombre, correo, rol o estado de una cuenta
      description: |
        `activo: false` suspende la cuenta: deja de poder ingresar y su sesión abierta deja de servir al instante.
        Un administrador no puede quitarse su propio rol ni suspenderse, y siempre debe quedar al menos un administrador activo.
      security: [{ bearer: [] }]
      x-roles: [administrador]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UsuarioCambios" }
            example: { activo: false }
      responses:
        "200":
          description: Cuenta actualizada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UsuarioDetalle" }
        "400": { $ref: "#/components/responses/PeticionInvalida" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/Prohibido" }
        "404": { $ref: "#/components/responses/NoEncontrado" }
        "409": { $ref: "#/components/responses/Conflicto" }
        "422": { $ref: "#/components/responses/ValidacionFallida" }
    delete:
      tags: [Usuarios]
      operationId: eliminarUsuario
      summary: Elimina una cuenta sin datos
      description: Si el productor ya tiene lotes, responde 409 y se debe suspender en su lugar, para no romper el historial.
      security: [{ bearer: [] }]
      x-roles: [administrador]
      responses:
        "204": { description: Cuenta eliminada con su ficha y sus fincas }
        "400": { $ref: "#/components/responses/PeticionInvalida" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/Prohibido" }
        "404": { $ref: "#/components/responses/NoEncontrado" }
        "409": { $ref: "#/components/responses/Conflicto" }

  /usuarios/{usuario_id}/contrasena-temporal:
    parameters:
      - $ref: "#/components/parameters/UsuarioId"
    post:
      tags: [Usuarios]
      operationId: restablecerContrasena
      summary: Genera una contraseña temporal
      description: La contraseña se muestra una sola vez. La cuenta debe cambiarla al ingresar.
      security: [{ bearer: [] }]
      x-roles: [administrador]
      responses:
        "200":
          description: Contraseña temporal generada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContrasenaTemporal" }
        "400": { $ref: "#/components/responses/PeticionInvalida" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/Prohibido" }
        "404": { $ref: "#/components/responses/NoEncontrado" }

  /solicitudes-contrasena:
    get:
      tags: [Usuarios]
      operationId: listarSolicitudesContrasena
      summary: Solicitudes de contraseña nueva hechas desde «¿Olvidó su contraseña?»
      security: [{ bearer: [] }]
      x-roles: [administrador]
      parameters:
        - $ref: "#/components/parameters/Pagina"
        - $ref: "#/components/parameters/PorPagina"
        - name: estado
          in: query
          description: Sin este parámetro se listan todas, de la más reciente a la más antigua.
          schema: { $ref: "#/components/schemas/EstadoSolicitud" }
      responses:
        "200":
          description: Página de solicitudes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListaSolicitudes" }
        "400": { $ref: "#/components/responses/PeticionInvalida" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/Prohibido" }

  /solicitudes-contrasena/{solicitud_id}/atender:
    parameters:
      - $ref: "#/components/parameters/SolicitudId"
    post:
      tags: [Usuarios]
      operationId: atenderSolicitudContrasena
      summary: Atiende una solicitud generando una contraseña temporal
      description: La cuenta deberá cambiarla al ingresar. La contraseña se muestra una sola vez.
      security: [{ bearer: [] }]
      x-roles: [administrador]
      responses:
        "200":
          description: Contraseña temporal generada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContrasenaTemporal" }
        "400": { $ref: "#/components/responses/PeticionInvalida" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/Prohibido" }
        "404": { $ref: "#/components/responses/NoEncontrado" }
        "409": { $ref: "#/components/responses/Conflicto" }

  /solicitudes-contrasena/{solicitud_id}/descartar:
    parameters:
      - $ref: "#/components/parameters/SolicitudId"
    post:
      tags: [Usuarios]
      operationId: descartarSolicitudContrasena
      summary: Descarta una solicitud (por ejemplo, si no la hizo el titular)
      security: [{ bearer: [] }]
      x-roles: [administrador]
      responses:
        "204": { description: Solicitud descartada }
        "400": { $ref: "#/components/responses/PeticionInvalida" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/Prohibido" }
        "404": { $ref: "#/components/responses/NoEncontrado" }
        "409": { $ref: "#/components/responses/Conflicto" }

  /fincas:
    get:
      tags: [Fincas]
      operationId: listarFincas
      summary: Lista las fincas del productor de la sesión (todas, si es administrador)
      security: [{ bearer: [] }]
      parameters:
        - $ref: "#/components/parameters/Pagina"
        - $ref: "#/components/parameters/PorPagina"
        - name: productor_id
          in: query
          description: Solo para administradores; un productor siempre ve las suyas.
          schema: { type: string, format: uuid }
        - name: activo
          in: query
          schema: { type: boolean }
      responses:
        "200":
          description: Página de fincas
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListaFincas" }
        "400": { $ref: "#/components/responses/PeticionInvalida" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
    post:
      tags: [Fincas]
      operationId: crearFinca
      summary: Registra una finca
      description: |
        Un productor puede omitir `productor_id`; un administrador debe enviarlo. El nombre no se repite entre las
        fincas del mismo productor. Si se envía `ubicacion`, debe quedar a menos de 120 km de la cabecera del municipio.
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FincaEntrada" }
            example:
              nombre: Finca La Esperanza
              municipio: Yopal
              vereda: El Charte
              ubicacion: { type: Point, coordinates: [-72.33, 5.29] }
              area_ha: 420
      responses:
        "201":
          description: Finca creada
          headers:
            Location: { $ref: "#/components/headers/Location" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Finca" }
        "400": { $ref: "#/components/responses/PeticionInvalida" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/Prohibido" }
        "409": { $ref: "#/components/responses/Conflicto" }
        "422": { $ref: "#/components/responses/ValidacionFallida" }

  /fincas/{finca_id}:
    parameters:
      - $ref: "#/components/parameters/FincaId"
    get:
      tags: [Fincas]
      operationId: obtenerFinca
