            creado_en: "2026-10-12T08:25:00-05:00"
            actualizado_en: "2026-10-12T08:25:00-05:00"

  schemas:
    Error:
      type: object
      description: Forma única de todos los errores de la API.
      required: [codigo, mensaje, detalles]
      properties:
        codigo:
          type: string
          enum: [PETICION_INVALIDA, NO_AUTENTICADO, PROHIBIDO, NO_ENCONTRADO, CONFLICTO, VALIDACION_FALLIDA, DEMASIADAS_SOLICITUDES, SERVICIO_EXTERNO_NO_DISPONIBLE, ERROR_INTERNO]
          description: Código estable, pensado para que el cliente decida qué mostrar.
        mensaje:
          type: string
          description: Texto comprensible para el usuario final, en español.
        detalles:
          type: array
          description: Un elemento por campo con problema. Lista vacía si el error no es de un campo.
          items:
            type: object
            required: [campo, problema]
            properties:
              campo: { type: string }
              problema: { type: string }

    Salud:
      type: object
      required: [estado, base_datos, version]
      properties:
        estado: { type: string, enum: [ok] }
        base_datos: { type: string, enum: [ok] }
        version: { type: string }

    Paginacion:
      type: object
      required: [pagina, por_pagina, total]
      properties:
        pagina: { type: integer, minimum: 1 }
        por_pagina: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, minimum: 0 }

    Marcas:
      type: object
      description: Campos de control presentes en toda entidad.
      required: [creado_en, actualizado_en]
      properties:
        creado_en: { type: string, format: date-time, readOnly: true }
        actualizado_en: { type: string, format: date-time, readOnly: true }

    PuntoGeoJSON:
      type: object
      required: [type, coordinates]
      properties:
        type: { type: string, const: Point }
        coordinates:
          type: array
          description: "[longitud, latitud] en EPSG:4326 (primero longitud, como exige GeoJSON)"
          minItems: 2
          maxItems: 2
          items: { type: number, minimum: -180, maximum: 180 }

    LineaGeoJSON:
      type: object
      required: [type, coordinates]
      properties:
        type: { type: string, const: LineString }
        coordinates:
          type: array
          minItems: 2
          items:
            type: array
            minItems: 2
            maxItems: 2
            items: { type: number, minimum: -180, maximum: 180 }

    Categoria:
      type: string
      description: Categoría comercial del animal; define qué precio se aplica.
      enum: [novillo_gordo, vaca_gorda, novillo_levante, ternero_destete, toro]

    EstadoLote:
      type: string
      enum: [disponible, simulado, vendido]

    TipoDestino:
      type: string
      description: "`finca` es la venta en la propia finca a un comprador que asume el transporte."
      enum: [finca, subasta, feria, frigorifico, planta_beneficio]

    FuenteRuta:
      type: string
      description: De dónde salió la ruta. `respaldo_linea_recta` se usa si OSRM no responde.
      enum: [osrm, manual, respaldo_linea_recta]

    Rol:
      type: string
      enum: [administrador, productor]

    # ---------- Autenticación ----------
    RegistroEntrada:
      type: object
      required: [tipo_persona, tipo_documento, numero_documento, nombre_completo, correo, contrasena, municipio, acepta_tratamiento_datos]
      properties:
        tipo_persona: { $ref: "#/components/schemas/TipoPersona" }
        tipo_documento: { $ref: "#/components/schemas/TipoDocumento" }
        numero_documento:
          type: string
          minLength: 5
          maxLength: 15
          description: "Sin puntos. NIT con su dígito de verificación: 900123456-7."
        nombre_completo:
          type: string
          minLength: 3
          maxLength: 120
          description: Nombre de la persona o razón social de la empresa.
        representante_legal:
          type: [string, "null"]
          minLength: 3
          maxLength: 120
          description: Obligatorio para empresas.
        correo: { type: string, format: email, maxLength: 120 }
        contrasena:
          type: string
          minLength: 10
          maxLength: 72
          writeOnly: true
          description: Mínimo 10 caracteres. Se guarda cifrada con bcrypt; nunca se devuelve.
        municipio: { $ref: "#/components/schemas/MunicipioCasanare" }
        vereda: { type: [string, "null"], maxLength: 80 }
        telefono: { $ref: "#/components/schemas/Telefono" }
        acepta_tratamiento_datos:
          type: boolean
          const: true
          description: Autorización de tratamiento de datos personales (Ley 1581 de 2012).
    IngresoEntrada:
      type: object
      required: [correo, contrasena]
      properties:
        correo: { type: string, format: email, maxLength: 120 }
        contrasena: { type: string, minLength: 1, maxLength: 72, writeOnly: true }
    Usuario:
      type: object
      required: [id, nombre_completo, correo, rol, productor_id, activo, debe_cambiar_contrasena, ultimo_ingreso, creado_en, actualizado_en]
      properties:
        id: { type: string, format: uuid }
        nombre_completo: { type: string }
        correo: { type: string, format: email }
        rol: { $ref: "#/components/schemas/Rol" }
        productor_id:
          type: [string, "null"]
          format: uuid
          description: Ficha de productor asociada. Nula para administradores.
        activo: { type: boolean, description: "false = cuenta suspendida; no puede iniciar sesión." }
        debe_cambiar_contrasena: { type: boolean, description: La cuenta tiene una contraseña temporal. }
        ultimo_ingreso: { type: [string, "null"], format: date-time }
        creado_en: { type: string, format: date-time }
        actualizado_en: { type: string, format: date-time }
    Sesion:
      type: object
      required: [token, tipo, expira_en, usuario]
      properties:
        token: { type: string, description: JWT firmado con HS256. }
        tipo: { type: string, const: Bearer }
        expira_en: { type: integer, description: Segundos de validez del token. }
        usuario: { $ref: "#/components/schemas/Usuario" }

    # ---------- Productor ----------
    ProductorEntrada:
      type: object
      required: [tipo_persona, tipo_documento, numero_documento, nombre_completo, municipio]
      properties:
        tipo_persona: { $ref: "#/components/schemas/TipoPersona" }
        tipo_documento: { $ref: "#/components/schemas/TipoDocumento" }
        numero_documento: { type: string, minLength: 5, maxLength: 15 }
        representante_legal: { type: [string, "null"], minLength: 3, maxLength: 120 }
        nombre_completo: { type: string, minLength: 3, maxLength: 120 }
        municipio: { $ref: "#/components/schemas/MunicipioCasanare" }
        vereda: { type: [string, "null"], maxLength: 80 }
        telefono: { $ref: "#/components/schemas/Telefono" }
        correo:
          type: [string, "null"]
          format: email
          maxLength: 120
    ProductorCambios:
      type: object
      minProperties: 1
      properties:
        tipo_persona: { $ref: "#/components/schemas/TipoPersona" }
        tipo_documento: { $ref: "#/components/schemas/TipoDocumento" }
        numero_documento: { type: string, minLength: 5, maxLength: 15 }
        representante_legal: { type: [string, "null"], minLength: 3, maxLength: 120 }
        nombre_completo: { type: string, minLength: 3, maxLength: 120 }
        municipio: { $ref: "#/components/schemas/MunicipioCasanare" }
        vereda: { type: [string, "null"], maxLength: 80 }
        telefono: { $ref: "#/components/schemas/Telefono" }
        correo: { type: [string, "null"], format: email, maxLength: 120 }
        documento_verificado: { type: boolean, description: Solo administradores. }
    Productor:
      type: object
      required: [id, tipo_persona, tipo_documento, numero_documento, representante_legal, nombre_completo, departamento, municipio, vereda, telefono, correo, documento_verificado, acepta_datos_en, creado_en, actualizado_en]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        tipo_persona: { $ref: "#/components/schemas/TipoPersona" }
        tipo_documento:
          oneOf:
            - { $ref: "#/components/schemas/TipoDocumento" }
            - { type: "null" }
          description: Nulo en fichas antiguas que aún no completan el documento.
        numero_documento: { type: [string, "null"] }
        representante_legal: { type: [string, "null"] }
        nombre_completo: { type: string }
        departamento: { type: string }
        municipio: { type: string }
        vereda: { type: [string, "null"] }
        telefono: { type: [string, "null"] }
        correo: { type: [string, "null"], format: email }
        documento_verificado: { type: boolean, readOnly: true }
        acepta_datos_en: { type: [string, "null"], format: date-time, readOnly: true, description: Momento en que aceptó el tratamiento de datos. }
        creado_en: { type: string, format: date-time, readOnly: true }
        actualizado_en: { type: string, format: date-time, readOnly: true }
    ListaProductores:
      allOf:
        - $ref: "#/components/schemas/Paginacion"
        - type: object
          required: [datos]
          properties:
            datos:
              type: array
              items: { $ref: "#/components/schemas/Productor" }

    # ---------- Lote ----------
    LoteEntrada:
      type: object
      required: [nombre, cantidad_animales, peso_promedio_kg, categoria]
      description: Indique `finca_id` (recomendado; el municipio de origen sale de la finca) o `municipio_origen`.
      properties:
        productor_id:
          type: string
          format: uuid
          description: Obligatorio para administradores; un productor puede omitirlo.
        finca_id: { type: [string, "null"], format: uuid, description: Finca activa del mismo productor. }
        nombre: { type: string, minLength: 3, maxLength: 80 }
        cantidad_animales: { type: integer, minimum: 1, maximum: 200 }
        peso_promedio_kg: { type: number, minimum: 80, maximum: 900, multipleOf: 0.1 }
        categoria: { $ref: "#/components/schemas/Categoria" }
        raza: { type: [string, "null"], maxLength: 40 }
        finca: { type: [string, "null"], maxLength: 80, description: Nombre libre; se ignora si se envía `finca_id`. }
        municipio_origen: { $ref: "#/components/schemas/MunicipioCasanare" }
    LoteCambios:
      type: object
      minProperties: 1
      properties:
        finca_id: { type: [string, "null"], format: uuid }
        nombre: { type: string, minLength: 3, maxLength: 80 }
        cantidad_animales: { type: integer, minimum: 1, maximum: 200 }
        peso_promedio_kg: { type: number, minimum: 80, maximum: 900, multipleOf: 0.1 }
        categoria: { $ref: "#/components/schemas/Categoria" }
        raza: { type: [string, "null"], maxLength: 40 }
        finca: { type: [string, "null"], maxLength: 80 }
        municipio_origen: { $ref: "#/components/schemas/MunicipioCasanare" }
        estado: { $ref: "#/components/schemas/EstadoLote" }
    Lote:
      type: object
      required: [id, productor_id, finca_id, nombre, cantidad_animales, peso_promedio_kg, peso_total_kg, categoria, raza, finca, municipio_origen, estado, simulaciones, creado_en, actualizado_en]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        productor_id: { type: string, format: uuid }
        finca_id: { type: [string, "null"], format: uuid }
        nombre: { type: string }
        cantidad_animales: { type: integer, minimum: 1, maximum: 200 }
        peso_promedio_kg: { type: number }
        peso_total_kg:
          type: number
          readOnly: true
          description: Calculado por la base de datos (cantidad_animales × peso_promedio_kg).
        categoria: { $ref: "#/components/schemas/Categoria" }
        raza: { type: [string, "null"] }
        finca: { type: [string, "null"] }
        municipio_origen: { type: string }
        estado: { $ref: "#/components/schemas/EstadoLote" }
        simulaciones: { type: integer, minimum: 0, readOnly: true, description: Simulaciones hechas con el lote; si es mayor que 0 no se puede eliminar. }
        creado_en: { type: string, format: date-time, readOnly: true }
        actualizado_en: { type: string, format: date-time, readOnly: true }
    ListaLotes:
      allOf:
        - $ref: "#/components/schemas/Paginacion"
        - type: object
          required: [datos]
          properties:
            datos:
              type: array
              items: { $ref: "#/components/schemas/Lote" }

    MunicipioCasanare:
      type: string
      description: Municipio de Casanare (lista cerrada; de aquí salen las rutas).
      enum: [Yopal, Aguazul, Chámeza, Hato Corozal, La Salina, Maní, Monterrey, Nunchía, Orocué, Paz de Ariporo, Pore, Recetor, Sabanalarga, Sácama, San Luis de Palenque, Támara, Tauramena, Trinidad, Villanueva]
    TipoPersona:
      type: string
      description: "`natural` = persona individual (cédula); `juridica` = empresa (NIT y representante legal)."
      enum: [natural, juridica]
    TipoDocumento:
      type: string
      description: "CC = cédula de ciudadanía, CE = cédula de extranjería, NIT = empresa (con dígito de verificación)."
      enum: [CC, CE, NIT]
    Telefono:
      type: [string, "null"]
      pattern: "^3[0-9]{9}$"
      description: Celular colombiano de 10 dígitos.
    PuntoOpcional:
      oneOf:
        - { $ref: "#/components/schemas/PuntoGeoJSON" }
        - { type: "null" }

    UsuarioDetalle:
      allOf:
        - $ref: "#/components/schemas/Usuario"
        - type: object
          required: [productor]
          properties:
            productor:
              oneOf:
                - { $ref: "#/components/schemas/Productor" }
                - { type: "null" }
              description: Ficha del productor; nula para administradores sin ficha.
    ListaUsuarios:
      allOf:
        - $ref: "#/components/schemas/Paginacion"
        - type: object
          required: [datos]
          properties:
            datos:
              type: array
              items: { $ref: "#/components/schemas/UsuarioDetalle" }
    UsuarioEntrada:
      type: object
      required: [rol, nombre_completo, correo, contrasena]
      description: Si `rol` es `productor`, también son obligatorios `tipo_persona`, `tipo_documento`, `numero_documento` y `municipio`.
      properties:
        rol: { $ref: "#/components/schemas/Rol" }
        nombre_completo: { type: string, minLength: 3, maxLength: 120 }
        correo: { type: string, format: email, maxLength: 120 }
        contrasena: { type: string, minLength: 10, maxLength: 72, writeOnly: true, description: Contraseña inicial; la cuenta deberá cambiarla al ingresar. }
        tipo_persona: { $ref: "#/components/schemas/TipoPersona" }
        tipo_documento: { $ref: "#/components/schemas/TipoDocumento" }
        numero_documento: { type: string, minLength: 5, maxLength: 15 }
        representante_legal: { type: [string, "null"], minLength: 3, maxLength: 120 }
        municipio: { $ref: "#/components/schemas/MunicipioCasanare" }
        vereda: { type: [string, "null"], maxLength: 80 }
        telefono: { $ref: "#/components/schemas/Telefono" }
    UsuarioCambios:
      type: object
      minProperties: 1
      properties:
        nombre_completo: { type: string, minLength: 3, maxLength: 120 }
        correo: { type: string, format: email, maxLength: 120 }
        rol: { $ref: "#/components/schemas/Rol" }
        activo: { type: boolean, description: "false = cuenta suspendida." }
    ContrasenaTemporal:
      type: object
      required: [contrasena_temporal]
      properties:
        contrasena_temporal: { type: string, description: Se muestra una sola vez; entréguela al usuario por un medio seguro. }
    PerfilCambios:
      type: object
      minProperties: 1
      properties:
        nombre_completo: { type: string, minLength: 3, maxLength: 120 }
        correo: { type: string, format: email, maxLength: 120 }
        telefono: { $ref: "#/components/schemas/Telefono" }
        municipio: { $ref: "#/components/schemas/MunicipioCasanare" }
        vereda: { type: [string, "null"], maxLength: 80 }
        tipo_persona: { $ref: "#/components/schemas/TipoPersona" }
        tipo_documento: { $ref: "#/components/schemas/TipoDocumento" }
        numero_documento: { type: string, minLength: 5, maxLength: 15 }
        representante_legal: { type: [string, "null"], minLength: 3, maxLength: 120 }
    RecuperacionEntrada:
      type: object
      required: [correo, numero_documento]
      properties:
        correo: { type: string, format: email, maxLength: 120 }
        numero_documento: { type: string, minLength: 5, maxLength: 15, description: "Cédula o NIT con el que se registró (sin puntos)." }
    Aviso:
      type: object
      required: [mensaje]
      properties:
        mensaje: { type: string }
    EstadoSolicitud:
      type: string
      enum: [pendiente, atendida, descartada]
    SolicitudContrasena:
      type: object
      required: [id, usuario_id, estado, atendida_por, atendida_en, usuario, creado_en, actualizado_en]
      properties:
        id: { type: string, format: uuid }
        usuario_id: { type: string, format: uuid }
        estado: { $ref: "#/components/schemas/EstadoSolicitud" }
        atendida_por: { type: [string, "null"], format: uuid }
        atendida_en: { type: [string, "null"], format: date-time }
        usuario:
          type: object
          description: Datos de la cuenta que pidió la contraseña, para que el administrador la reconozca.
          required: [nombre_completo, correo, activo, tipo_documento, numero_documento]
          properties:
            nombre_completo: { type: string }
            correo: { type: string, format: email }
            activo: { type: boolean }
            tipo_documento: { type: [string, "null"] }
            numero_documento: { type: [string, "null"] }
        creado_en: { type: string, format: date-time }
        actualizado_en: { type: string, format: date-time }
    ListaSolicitudes:
      allOf:
        - $ref: "#/components/schemas/Paginacion"
        - type: object
          required: [datos]
          properties:
            datos:
              type: array
              items: { $ref: "#/components/schemas/SolicitudContrasena" }
    CambioContrasena:
      type: object
      required: [contrasena_actual, contrasena_nueva]
      properties:
        contrasena_actual: { type: string, minLength: 1, maxLength: 72, writeOnly: true }
        contrasena_nueva: { type: string, minLength: 10, maxLength: 72, writeOnly: true }
    ConfirmarContrasena:
      type: object
      required: [contrasena]
      properties:
        contrasena: { type: string, minLength: 1, maxLength: 72, writeOnly: true }

    FincaEntrada:
      type: object
      required: [nombre, municipio]
      properties:
        productor_id: { type: string, format: uuid, description: Obligatorio para administradores. }
        nombre: { type: string, minLength: 3, maxLength: 80 }
        municipio: { $ref: "#/components/schemas/MunicipioCasanare" }
        vereda: { type: [string, "null"], maxLength: 80 }
        ubicacion: { $ref: "#/components/schemas/PuntoOpcional" }
        area_ha: { type: [number, "null"], exclusiveMinimum: 0, maximum: 100000, description: Área en hectáreas. }
    FincaCambios:
      type: object
      minProperties: 1
      properties:
        nombre: { type: string, minLength: 3, maxLength: 80 }
        municipio: { $ref: "#/components/schemas/MunicipioCasanare" }
        vereda: { type: [string, "null"], maxLength: 80 }
        ubicacion: { $ref: "#/components/schemas/PuntoOpcional" }
        area_ha: { type: [number, "null"], exclusiveMinimum: 0, maximum: 100000 }
        activo: { type: boolean }
    Finca:
      type: object
      required: [id, productor_id, nombre, departamento, municipio, vereda, ubicacion, area_ha, activo, lotes, creado_en, actualizado_en]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        productor_id: { type: string, format: uuid }
        nombre: { type: string }
        departamento: { type: string }
        municipio: { type: string }
        vereda: { type: [string, "null"] }
        ubicacion: { $ref: "#/components/schemas/PuntoOpcional" }
        area_ha: { type: [number, "null"] }
        activo: { type: boolean }
        lotes: { type: integer, minimum: 0, readOnly: true, description: Cantidad de lotes registrados en la finca. }
        creado_en: { type: string, format: date-time, readOnly: true }
        actualizado_en: { type: string, format: date-time, readOnly: true }
    ListaFincas:
      allOf:
        - $ref: "#/components/schemas/Paginacion"
        - type: object
          required: [datos]
          properties:
            datos:
              type: array
              items: { $ref: "#/components/schemas/Finca" }

    Resumen:
      type: object
      required: [usuarios, productores, fincas, lotes, simulaciones, destinos, precios, destinos_mas_elegidos]
      properties:
        usuarios:
          type: object
          required: [total, activos, suspendidos, administradores, deben_cambiar_contrasena, solicitudes_pendientes]
          properties:
            solicitudes_pendientes: { type: integer, description: Solicitudes de contraseña sin atender. }
            total: { type: integer }
            activos: { type: integer }
            suspendidos: { type: integer }
            administradores: { type: integer }
            deben_cambiar_contrasena: { type: integer }
        productores:
          type: object
          required: [total, personas, empresas, verificados, sin_documento]
          properties:
            total: { type: integer }
            personas: { type: integer }
            empresas: { type: integer }
            verificados: { type: integer }
            sin_documento: { type: integer }
        fincas: { type: integer }
        lotes:
          type: object
          required: [total, disponibles, simulados, vendidos]
          properties:
            total: { type: integer }
            disponibles: { type: integer }
            simulados: { type: integer }
            vendidos: { type: integer }
        simulaciones:
          type: object
          required: [total, ultimos_7_dias]
          properties:
            total: { type: integer }
            ultimos_7_dias: { type: integer }
        destinos:
          type: object
          required: [activos, inactivos]
          properties:
            activos: { type: integer }
            inactivos: { type: integer }
        precios:
          type: object
          required: [ultima_fecha, con_advertencia, vencidos]
          properties:
            ultima_fecha: { type: [string, "null"], format: date }
            con_advertencia: { type: integer, description: Combinaciones destino-categoría cuyo último precio tiene más de 7 días. }
            vencidos: { type: integer, description: Combinaciones cuyo último precio tiene más de 30 días. }
        destinos_mas_elegidos:
          type: array
          items:
            type: object
            required: [destino_id, nombre, veces]
            properties:
              destino_id: { type: string, format: uuid }
              nombre: { type: string }
              veces: { type: integer }

    EntradaBitacora:
      type: object
      required: [id, usuario_id, usuario_nombre, accion, recurso, recurso_id, detalle, creado_en]
      properties:
        id: { type: integer }
        usuario_id: { type: [string, "null"], format: uuid }
        usuario_nombre: { type: [string, "null"] }
        accion: { type: string, examples: [crear, actualizar, eliminar, suspender, reactivar, cambiar_rol, restablecer_contrasena, verificar_documento, importar, registrar, anonimizar] }
        recurso: { type: string, examples: [usuario, productor, destino, precio, finca] }
        recurso_id: { type: [string, "null"] }
        detalle: { type: object }
        creado_en: { type: string, format: date-time }
    ListaBitacora:
      allOf:
        - $ref: "#/components/schemas/Paginacion"
        - type: object
          required: [datos]
          properties:
            datos:
              type: array
              items: { $ref: "#/components/schemas/EntradaBitacora" }

    # ---------- Destino ----------
    DestinoEntrada:
      type: object
      required: [nombre, tipo, municipio, departamento, ubicacion]
      properties:
        nombre: { type: string, minLength: 3, maxLength: 100 }
        tipo: { $ref: "#/components/schemas/TipoDestino" }
        municipio: { type: string, minLength: 2, maxLength: 60 }
        departamento: { type: string, minLength: 2, maxLength: 60 }
        ubicacion: { $ref: "#/components/schemas/PuntoGeoJSON" }
        comision_pct:
          type: number
          minimum: 0
          maximum: 15
          default: 0
          description: Comisión que cobra el destino sobre el valor de la venta (las subastas cobran comisión).
        activo: { type: boolean, default: true }
    DestinoCambios:
      type: object
      minProperties: 1
      properties:
        nombre: { type: string, minLength: 3, maxLength: 100 }
        tipo: { $ref: "#/components/schemas/TipoDestino" }
        municipio: { type: string, minLength: 2, maxLength: 60 }
        departamento: { type: string, minLength: 2, maxLength: 60 }
        ubicacion: { $ref: "#/components/schemas/PuntoGeoJSON" }
        comision_pct: { type: number, minimum: 0, maximum: 15 }
        activo: { type: boolean }
    Destino:
      type: object
      required: [id, nombre, tipo, municipio, departamento, ubicacion, comision_pct, activo, creado_en, actualizado_en]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        nombre: { type: string, maxLength: 100 }
        tipo: { $ref: "#/components/schemas/TipoDestino" }
        municipio: { type: string, maxLength: 60 }
        departamento: { type: string, maxLength: 60 }
        ubicacion: { $ref: "#/components/schemas/PuntoGeoJSON" }
        comision_pct: { type: number, minimum: 0, maximum: 15 }
        activo: { type: boolean }
        distancia_lineal_km:
          type: number
          readOnly: true
          description: Solo aparece al usar el filtro espacial; distancia en línea recta al punto consultado.
        creado_en: { type: string, format: date-time, readOnly: true }
        actualizado_en: { type: string, format: date-time, readOnly: true }
    ListaDestinos:
      allOf:
        - $ref: "#/components/schemas/Paginacion"
        - type: object
          required: [datos]
          properties:
            datos:
              type: array
              items: { $ref: "#/components/schemas/Destino" }

    # ---------- Precio ----------
    PrecioMercadoEntrada:
      type: object
      required: [categoria, precio_kg_cop, fecha, fuente]
      properties:
        categoria: { $ref: "#/components/schemas/Categoria" }
        precio_kg_cop: { type: integer, minimum: 3000, maximum: 30000 }
        fecha: { type: string, format: date }
        fuente: { type: string, minLength: 3, maxLength: 160 }
        referencia:
          type: [string, "null"]
          maxLength: 300
          description: Dónde consultar el dato original (indicador o plaza del reporte de Fedegán, enlace).
    PrecioMercadoCambios:
      type: object
      minProperties: 1
      properties:
        precio_kg_cop: { type: integer, minimum: 3000, maximum: 30000 }
        fecha: { type: string, format: date }
        fuente: { type: string, minLength: 3, maxLength: 160 }
        referencia: { type: [string, "null"], maxLength: 300 }
    PrecioMercado:
      allOf:
        - type: object
          required: [id, destino_id]
          properties:
            id: { type: string, format: uuid, readOnly: true }
            destino_id: { type: string, format: uuid, readOnly: true }
            antiguedad_dias:
              type: integer
              readOnly: true
              description: Días transcurridos desde la fecha del precio hasta hoy.
            importacion_id:
              type: [string, "null"]
              format: uuid
              readOnly: true
              description: Carga por lotes de la que vino el precio; nulo si se registró a mano.
        - $ref: "#/components/schemas/PrecioMercadoEntrada"
        - $ref: "#/components/schemas/Marcas"

    ImportacionPrecios:
      type: object
      required: [id, fuente, origen, filas, insertados, actualizados, sin_cambios, usuario_id, creado_en, actualizado_en]
      properties:
        id: { type: string, format: uuid }
        fuente: { type: string }
        origen:
          type: string
          enum: [manual, programada]
          description: "`programada` = la tarea automática que lee la hoja publicada cada 3 días."
        filas: { type: integer, minimum: 0 }
        insertados: { type: integer, minimum: 0 }
        actualizados: { type: integer, minimum: 0 }
        sin_cambios: { type: integer, minimum: 0 }
        usuario_id: { type: [string, "null"], format: uuid }
        creado_en: { type: string, format: date-time }
        actualizado_en: { type: string, format: date-time }

    # ---------- Ruta ----------
    RutaEntrada:
      type: object
      required: [destino_id, distancia_km, tiempo_horas, geometria]
      properties:
        destino_id: { type: string, format: uuid }
        origen_nombre: { type: string, minLength: 3, maxLength: 80, default: Yopal (centro de acopio) }
        origen:
          $ref: "#/components/schemas/PuntoGeoJSON"
          description: Si se omite, se usa el primer punto de la geometría.
        distancia_km: { type: number, minimum: 0, maximum: 3000 }
        tiempo_horas: { type: number, minimum: 0, maximum: 72 }
        peajes_cop: { type: integer, minimum: 0, default: 0, description: Peajes de un camión en el trayecto. }
        factor_dificultad: { type: number, minimum: 1, maximum: 2, default: 1 }
        merma_pct: { type: number, minimum: 0, maximum: 15, default: 0 }
        geometria: { $ref: "#/components/schemas/LineaGeoJSON" }
        fuente: { $ref: "#/components/schemas/FuenteRuta" }
    RutaCambios:
      type: object
      minProperties: 1
      properties:
        distancia_km: { type: number, minimum: 0, maximum: 3000 }
        tiempo_horas: { type: number, minimum: 0, maximum: 72 }
        peajes_cop: { type: integer, minimum: 0 }
        factor_dificultad: { type: number, minimum: 1, maximum: 2 }
        merma_pct: { type: number, minimum: 0, maximum: 15 }
        geometria: { $ref: "#/components/schemas/LineaGeoJSON" }
        fuente: { $ref: "#/components/schemas/FuenteRuta" }
    Ruta:
      type: object
      required: [id, destino_id, origen_nombre, origen, distancia_km, tiempo_horas, peajes_cop, factor_dificultad, merma_pct, geometria, fuente, creado_en, actualizado_en]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        destino_id: { type: string, format: uuid }
        origen_nombre: { type: string, maxLength: 80 }
        origen: { $ref: "#/components/schemas/PuntoGeoJSON" }
        distancia_km: { type: number, minimum: 0, maximum: 3000 }
        tiempo_horas: { type: number, minimum: 0, maximum: 72 }
        peajes_cop: { type: integer, minimum: 0, description: Peajes de un camión en el trayecto. }
        factor_dificultad:
          type: number
          minimum: 1
          maximum: 2
          description: Recargo del flete por relieve y estado de la vía (1.00 = vía plana).
        merma_pct:
          type: number
          minimum: 0
          maximum: 15
          description: Pérdida de peso estimada del animal durante el viaje, en porcentaje.
        geometria: { $ref: "#/components/schemas/LineaGeoJSON" }
        fuente: { $ref: "#/components/schemas/FuenteRuta" }
        creado_en: { type: string, format: date-time, readOnly: true }
        actualizado_en: { type: string, format: date-time, readOnly: true }

    # ---------- Simulación ----------
    SimulacionEntrada:
      type: object
      required: [lote_id, flete_km_cop, destino_ids]
      properties:
        lote_id: { type: string, format: uuid }
        flete_km_cop:
          type: integer
          minimum: 1000
          maximum: 50000
          description: Valor del flete por kilómetro de un camión.
        capacidad_camion:
          type: integer
          minimum: 5
          maximum: 40
          default: 25
          description: Animales por camión (un ganadero de Yopal reporta 24 a 27).
        flete_incluye_peajes:
          type: boolean
          default: false
          description: Verdadero si el transportador paga los peajes dentro del flete.
        destino_ids:
          type: array
          description: Destinos a comparar. Cada uno genera una fila en resultado_simulacion.
          minItems: 2
          maxItems: 15
          uniqueItems: true
          items: { type: string, format: uuid }
    ResultadoSimulacion:
      type: object
      required: [id, simulacion_id, destino_id, ruta_id, distancia_km, tiempo_horas, merma_pct, camiones, peso_vendido_kg, precio_kg_cop, precio_fecha, precio_antiguedad_dias, advertencia, comision_cop, flete_cop, peajes_cop, costo_logistico_cop, ingreso_bruto_cop, utilidad_neta_cop, posicion, creado_en, actualizado_en]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        simulacion_id: { type: string, format: uuid }
        destino_id: { type: string, format: uuid }
        ruta_id: { type: string, format: uuid }
        distancia_km: { type: number, minimum: 0 }
        tiempo_horas: { type: number, minimum: 0 }
        merma_pct: { type: number, minimum: 0, maximum: 15 }
        camiones: { type: integer, minimum: 1 }
        peso_vendido_kg: { type: number, minimum: 0 }
        precio_kg_cop: { type: integer, minimum: 0 }
        precio_fecha: { type: string, format: date, description: Fecha del precio usado. }
        precio_antiguedad_dias: { type: integer, minimum: 0, description: Días entre la fecha del precio y la simulación. }
        advertencia:
          type: [string, "null"]
          description: Aviso si el precio tiene más de 7 días.
        comision_cop: { type: integer, minimum: 0 }
        flete_cop: { type: integer, minimum: 0 }
        peajes_cop: { type: integer, minimum: 0 }
        costo_logistico_cop: { type: integer, minimum: 0 }
        ingreso_bruto_cop: { type: integer, minimum: 0 }
        utilidad_neta_cop: { type: integer, description: Puede ser negativa si el costo supera el ingreso. }
        posicion: { type: integer, minimum: 1, description: 1 = destino con mayor utilidad. }
        creado_en: { type: string, format: date-time, readOnly: true }
        actualizado_en: { type: string, format: date-time, readOnly: true }
    Simulacion:
      type: object
      required: [id, lote_id, flete_km_cop, capacidad_camion, flete_incluye_peajes, mejor_destino_id, resultados, creado_en, actualizado_en]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        lote_id: { type: string, format: uuid }
        flete_km_cop: { type: integer, minimum: 1000, maximum: 50000 }
        capacidad_camion: { type: integer, minimum: 5, maximum: 40 }
        flete_incluye_peajes: { type: boolean }
        mejor_destino_id: { type: string, format: uuid }
        resultados:
          type: array
          description: Filas de resultado_simulacion, ordenadas por posicion.
          items: { $ref: "#/components/schemas/ResultadoSimulacion" }
        creado_en: { type: string, format: date-time, readOnly: true }
        actualizado_en: { type: string, format: date-time, readOnly: true }
    ListaSimulaciones:
      allOf:
        - $ref: "#/components/schemas/Paginacion"
        - type: object
          required: [datos]
          properties:
            datos:
              type: array
              items: { $ref: "#/components/schemas/Simulacion" }
