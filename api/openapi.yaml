                    pagina: 1
                    por_pagina: 20
                    total: 1
                vacio:
                  summary: Productor sin simulaciones
                  value:
                    datos: []
                    pagina: 1
                    por_pagina: 20
                    total: 0
        "400": { $ref: "#/components/responses/PeticionInvalida" }
    post:
      tags: [Simulaciones]
      operationId: crearSimulacion
      summary: Calcula y guarda la comparación de destinos para un lote
      description: |
        Calcula la utilidad neta del lote en cada destino de `destino_ids`, ordena los resultados
        de mayor a menor utilidad (`posicion` 1 es el mejor) y guarda `mejor_destino_id`.
        Responde 422 si algún destino no tiene precio vigente para la categoría del lote o no tiene ruta.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SimulacionEntrada" }
            example:
              lote_id: 9bad2b17-c8e0-57f7-ac48-2d1cf99ad088
              flete_km_cop: 7000
              destino_ids:
                - acca0ef8-f855-5505-b81b-25833e792ff1
                - 6b8211cf-49f9-5354-925a-ec5edb230ee1
                - 52bbc2f4-901c-5ff0-a08a-5f8f08f91fa1
                - 15bf935c-dea7-52e8-a312-228463fe5aef
      responses:
        "201":
          description: Simulación calculada y guardada
          headers:
            Location: { $ref: "#/components/headers/Location" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Simulacion" }
              examples:
                novillos: { $ref: "#/components/examples/SimulacionNovillos" }
        "400": { $ref: "#/components/responses/PeticionInvalida" }
        "404":
          description: El lote no existe
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                codigo: NO_ENCONTRADO
                mensaje: No existe un lote con id 00000000-0000-4000-8000-000000000000.
                detalles:
                  - campo: lote_id
                    problema: Lote inexistente.
        "422":
          description: Los datos no permiten calcular la simulación
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                codigo: VALIDACION_FALLIDA
                mensaje: No se puede calcular la utilidad para uno de los destinos elegidos.
                detalles:
                  - campo: destino_ids[2]
                    problema: Planta de beneficio de Cúcuta no tiene precio vigente para vaca_gorda.

  /simulaciones/{simulacion_id}:
    parameters:
      - name: simulacion_id
        in: path
        required: true
        schema: { type: string, format: uuid }
        example: d014a3b6-e98c-5057-a5c1-37dcf2aebb6b
    get:
      tags: [Simulaciones]
      operationId: obtenerSimulacion
      summary: Obtiene una simulación con el desglose por destino
      responses:
        "200":
          description: Simulación encontrada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Simulacion" }
              examples:
                novillos: { $ref: "#/components/examples/SimulacionNovillos" }
        "400": { $ref: "#/components/responses/PeticionInvalida" }
        "404": { $ref: "#/components/responses/NoEncontrado" }

components:
  parameters:
    Pagina:
      name: pagina
      in: query
      description: Número de página, empezando en 1.
      schema: { type: integer, minimum: 1, default: 1 }
    PorPagina:
      name: por_pagina
      in: query
      description: Registros por página.
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    ProductorId:
      name: productor_id
      in: path
      required: true
      schema: { type: string, format: uuid }
      example: cd3b83ce-114a-5624-bde0-0c482a535db2
    LoteId:
      name: lote_id
      in: path
      required: true
      schema: { type: string, format: uuid }
      example: 9bad2b17-c8e0-57f7-ac48-2d1cf99ad088
    DestinoId:
      name: destino_id
      in: path
      required: true
      schema: { type: string, format: uuid }
      example: 52bbc2f4-901c-5ff0-a08a-5f8f08f91fa1

  headers:
    Location:
      description: URL del recurso recién creado.
      schema: { type: string, format: uri-reference }

  responses:
    PeticionInvalida:
      description: La petición está mal formada (JSON inválido, parámetro con tipo equivocado o UUID mal escrito)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            codigo: PETICION_INVALIDA
            mensaje: Hay parámetros con formato no válido.
            detalles:
              - campo: lote_id
                problema: Se esperaba un UUID y se recibió "lote-1".
    NoEncontrado:
      description: El recurso no existe
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            codigo: NO_ENCONTRADO
            mensaje: El recurso solicitado no existe.
            detalles: []
    ValidacionFallida:
      description: El cuerpo es JSON válido pero algún campo incumple las reglas de negocio
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            codigo: VALIDACION_FALLIDA
            mensaje: Hay campos con valores no permitidos.
            detalles:
              - campo: precio_kg_cop
                problema: Debe estar entre 3000 y 30000 COP.

