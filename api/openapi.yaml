  schemas:
    Error:
      type: object
      description: Forma única de todos los errores de la API.
      required: [codigo, mensaje, detalles]
      properties:
        codigo:
          type: string
          enum: [PETICION_INVALIDA, NO_AUTENTICADO, PROHIBIDO, NO_ENCONTRADO, CONFLICTO, VALIDACION_FALLIDA, DEMASIADAS_SOLICITUDES, SERVICIO_EXTERNO_NO_DISPONIBLE, ERROR_INTERNO]
          description: Código estable, pensado para que el cliente decida qué mostrar.
        mensaje:
          type: string
          description: Texto comprensible para el usuario final, en español.
        detalles:
          type: array
          description: Un elemento por campo con problema. Lista vacía si el error no es de un campo.
          items:
            type: object
            required: [campo, problema]
            properties:
              campo: { type: string }
              problema: { type: string }

    Salud:
      type: object
      required: [estado, base_datos, version]
      properties:
        estado: { type: string, enum: [ok] }
        base_datos: { type: string, enum: [ok] }
        version: { type: string }

    Paginacion:
      type: object
      required: [pagina, por_pagina, total]
      properties:
        pagina: { type: integer, minimum: 1 }
        por_pagina: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, minimum: 0 }

    Marcas:
      type: object
      description: Campos de control presentes en toda entidad.
      required: [creado_en, actualizado_en]
      properties:
        creado_en: { type: string, format: date-time, readOnly: true }
        actualizado_en: { type: string, format: date-time, readOnly: true }

    PuntoGeoJSON:
      type: object
      required: [type, coordinates]
      properties:
        type: { type: string, const: Point }
        coordinates:
          type: array
          description: "[longitud, latitud] en EPSG:4326 (primero longitud, como exige GeoJSON)"
          minItems: 2
          maxItems: 2
          items: { type: number, minimum: -180, maximum: 180 }

    LineaGeoJSON:
      type: object
      required: [type, coordinates]
      properties:
        type: { type: string, const: LineString }
        coordinates:
          type: array
          minItems: 2
          items:
            type: array
            minItems: 2
            maxItems: 2
            items: { type: number, minimum: -180, maximum: 180 }

    Categoria:
      type: string
      description: Categoría comercial del animal; define qué precio se aplica.
      enum: [novillo_gordo, vaca_gorda, novillo_levante, ternero_destete, toro]

    EstadoLote:
      type: string
      enum: [disponible, simulado, vendido]

    TipoDestino:
      type: string
      description: "`finca` es la venta en la propia finca a un comprador que asume el transporte."
      enum: [finca, subasta, feria, frigorifico, planta_beneficio]

    FuenteRuta:
      type: string
      description: De dónde salió la ruta. `respaldo_linea_recta` se usa si OSRM no responde.
      enum: [osrm, manual, respaldo_linea_recta]

    Rol:
      type: string
      enum: [administrador, productor]

    # ---------- Autenticación ----------
    RegistroEntrada:
      type: object
      required: [nombre_completo, correo, contrasena, municipio]
      properties:
        nombre_completo: { type: string, minLength: 3, maxLength: 120 }
        correo: { type: string, format: email, maxLength: 120 }
        contrasena:
          type: string
          minLength: 10
          maxLength: 72
          writeOnly: true
          description: Mínimo 10 caracteres. Se guarda cifrada con bcrypt; nunca se devuelve.
        municipio: { type: string, minLength: 2, maxLength: 60 }
        telefono:
          type: [string, "null"]
          pattern: "^3[0-9]{9}$"
    IngresoEntrada:
      type: object
      required: [correo, contrasena]
      properties:
        correo: { type: string, format: email, maxLength: 120 }
        contrasena: { type: string, minLength: 1, maxLength: 72, writeOnly: true }
    Usuario:
      type: object
      required: [id, nombre_completo, correo, rol, productor_id, creado_en, actualizado_en]
      properties:
        id: { type: string, format: uuid }
        nombre_completo: { type: string }
        correo: { type: string, format: email }
        rol: { $ref: "#/components/schemas/Rol" }
        productor_id:
          type: [string, "null"]
          format: uuid
          description: Ficha de productor asociada. Nula para administradores.
        creado_en: { type: string, format: date-time }
        actualizado_en: { type: string, format: date-time }
    Sesion:
      type: object
      required: [token, tipo, expira_en, usuario]
      properties:
        token: { type: string, description: JWT firmado con HS256. }
        tipo: { type: string, const: Bearer }
        expira_en: { type: integer, description: Segundos de validez del token. }
        usuario: { $ref: "#/components/schemas/Usuario" }

    # ---------- Productor ----------
    ProductorEntrada:
      type: object
      required: [nombre_completo, municipio]
      properties:
        nombre_completo: { type: string, minLength: 3, maxLength: 120 }
        municipio: { type: string, minLength: 2, maxLength: 60 }
        telefono:
          type: [string, "null"]
          pattern: "^3[0-9]{9}$"
          description: Celular colombiano de 10 dígitos.
        correo:
          type: [string, "null"]
          format: email
          maxLength: 120
    ProductorCambios:
      type: object
      minProperties: 1
      properties:
        nombre_completo: { type: string, minLength: 3, maxLength: 120 }
        municipio: { type: string, minLength: 2, maxLength: 60 }
        telefono: { type: [string, "null"], pattern: "^3[0-9]{9}$" }
        correo: { type: [string, "null"], format: email, maxLength: 120 }
    Productor:
      allOf:
        - type: object
          required: [id]
          properties:
            id: { type: string, format: uuid, readOnly: true }
        - $ref: "#/components/schemas/ProductorEntrada"
        - $ref: "#/components/schemas/Marcas"
    ListaProductores:
      allOf:
        - $ref: "#/components/schemas/Paginacion"
        - type: object
          required: [datos]
          properties:
            datos:
              type: array
              items: { $ref: "#/components/schemas/Productor" }

    # ---------- Lote ----------
    LoteEntrada:
      type: object
      required: [nombre, cantidad_animales, peso_promedio_kg, categoria, municipio_origen]
      properties:
        productor_id:
          type: string
          format: uuid
          description: Obligatorio para administradores; un productor puede omitirlo.
        nombre: { type: string, minLength: 3, maxLength: 80 }
        cantidad_animales: { type: integer, minimum: 1, maximum: 200 }
        peso_promedio_kg: { type: number, minimum: 80, maximum: 900, multipleOf: 0.1 }
        categoria: { $ref: "#/components/schemas/Categoria" }
        raza: { type: [string, "null"], maxLength: 40 }
        finca: { type: [string, "null"], maxLength: 80 }
        municipio_origen: { type: string, minLength: 2, maxLength: 60 }
    LoteCambios:
      type: object
      minProperties: 1
      properties:
        nombre: { type: string, minLength: 3, maxLength: 80 }
        cantidad_animales: { type: integer, minimum: 1, maximum: 200 }
        peso_promedio_kg: { type: number, minimum: 80, maximum: 900, multipleOf: 0.1 }
        categoria: { $ref: "#/components/schemas/Categoria" }
        raza: { type: [string, "null"], maxLength: 40 }
        finca: { type: [string, "null"], maxLength: 80 }
        municipio_origen: { type: string, minLength: 2, maxLength: 60 }
        estado: { $ref: "#/components/schemas/EstadoLote" }
    Lote:
      type: object
      required: [id, productor_id, nombre, cantidad_animales, peso_promedio_kg, peso_total_kg, categoria, raza, finca, municipio_origen, estado, creado_en, actualizado_en]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        productor_id: { type: string, format: uuid }
        nombre: { type: string }
        cantidad_animales: { type: integer, minimum: 1, maximum: 200 }
        peso_promedio_kg: { type: number }
        peso_total_kg:
          type: number
          readOnly: true
          description: Calculado por la base de datos (cantidad_animales × peso_promedio_kg).
        categoria: { $ref: "#/components/schemas/Categoria" }
        raza: { type: [string, "null"] }
        finca: { type: [string, "null"] }
        municipio_origen: { type: string }
        estado: { $ref: "#/components/schemas/EstadoLote" }
        creado_en: { type: string, format: date-time, readOnly: true }
        actualizado_en: { type: string, format: date-time, readOnly: true }
    ListaLotes:
      allOf:
        - $ref: "#/components/schemas/Paginacion"
        - type: object
          required: [datos]
          properties:
            datos:
              type: array
              items: { $ref: "#/components/schemas/Lote" }

    # ---------- Destino ----------
    DestinoEntrada:
      type: object
      required: [nombre, tipo, municipio, departamento, ubicacion]
      properties:
        nombre: { type: string, minLength: 3, maxLength: 100 }
        tipo: { $ref: "#/components/schemas/TipoDestino" }
        municipio: { type: string, minLength: 2, maxLength: 60 }
        departamento: { type: string, minLength: 2, maxLength: 60 }
        ubicacion: { $ref: "#/components/schemas/PuntoGeoJSON" }
        comision_pct:
          type: number
          minimum: 0
          maximum: 15
          default: 0
          description: Comisión que cobra el destino sobre el valor de la venta (las subastas cobran comisión).
        activo: { type: boolean, default: true }
    DestinoCambios:
      type: object
      minProperties: 1
      properties:
        nombre: { type: string, minLength: 3, maxLength: 100 }
        tipo: { $ref: "#/components/schemas/TipoDestino" }
        municipio: { type: string, minLength: 2, maxLength: 60 }
        departamento: { type: string, minLength: 2, maxLength: 60 }
        ubicacion: { $ref: "#/components/schemas/PuntoGeoJSON" }
        comision_pct: { type: number, minimum: 0, maximum: 15 }
        activo: { type: boolean }
    Destino:
      type: object
      required: [id, nombre, tipo, municipio, departamento, ubicacion, comision_pct, activo, creado_en, actualizado_en]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        nombre: { type: string, maxLength: 100 }
        tipo: { $ref: "#/components/schemas/TipoDestino" }
        municipio: { type: string, maxLength: 60 }
        departamento: { type: string, maxLength: 60 }
        ubicacion: { $ref: "#/components/schemas/PuntoGeoJSON" }
        comision_pct: { type: number, minimum: 0, maximum: 15 }
        activo: { type: boolean }
        distancia_lineal_km:
          type: number
          readOnly: true
          description: Solo aparece al usar el filtro espacial; distancia en línea recta al punto consultado.
        creado_en: { type: string, format: date-time, readOnly: true }
        actualizado_en: { type: string, format: date-time, readOnly: true }
    ListaDestinos:
      allOf:
        - $ref: "#/components/schemas/Paginacion"
        - type: object
          required: [datos]
          properties:
            datos:
              type: array
              items: { $ref: "#/components/schemas/Destino" }

    # ---------- Precio ----------
    PrecioMercadoEntrada:
      type: object
      required: [categoria, precio_kg_cop, fecha, fuente]
      properties:
        categoria: { $ref: "#/components/schemas/Categoria" }
        precio_kg_cop: { type: integer, minimum: 3000, maximum: 30000 }
        fecha: { type: string, format: date }
        fuente: { type: string, minLength: 3, maxLength: 160 }
        referencia:
          type: [string, "null"]
          maxLength: 300
          description: Dónde consultar el dato original (indicador o plaza del reporte de Fedegán, enlace).
    PrecioMercadoCambios:
      type: object
      minProperties: 1
      properties:
        precio_kg_cop: { type: integer, minimum: 3000, maximum: 30000 }
        fecha: { type: string, format: date }
        fuente: { type: string, minLength: 3, maxLength: 160 }
        referencia: { type: [string, "null"], maxLength: 300 }
    PrecioMercado:
      allOf:
        - type: object
          required: [id, destino_id]
          properties:
            id: { type: string, format: uuid, readOnly: true }
            destino_id: { type: string, format: uuid, readOnly: true }
            antiguedad_dias:
              type: integer
              readOnly: true
              description: Días transcurridos desde la fecha del precio hasta hoy.
            importacion_id:
              type: [string, "null"]
              format: uuid
              readOnly: true
              description: Carga por lotes de la que vino el precio; nulo si se registró a mano.
        - $ref: "#/components/schemas/PrecioMercadoEntrada"
        - $ref: "#/components/schemas/Marcas"

    ImportacionPrecios:
      type: object
      required: [id, fuente, origen, filas, insertados, actualizados, sin_cambios, usuario_id, creado_en, actualizado_en]
      properties:
        id: { type: string, format: uuid }
        fuente: { type: string }
        origen:
          type: string
          enum: [manual, programada]
          description: "`programada` = la tarea automática que lee la hoja publicada cada 3 días."
        filas: { type: integer, minimum: 0 }
        insertados: { type: integer, minimum: 0 }
        actualizados: { type: integer, minimum: 0 }
        sin_cambios: { type: integer, minimum: 0 }
        usuario_id: { type: [string, "null"], format: uuid }
        creado_en: { type: string, format: date-time }
        actualizado_en: { type: string, format: date-time }

    # ---------- Ruta ----------
    RutaEntrada:
      type: object
      required: [destino_id, distancia_km, tiempo_horas, geometria]
      properties:
        destino_id: { type: string, format: uuid }
        origen_nombre: { type: string, minLength: 3, maxLength: 80, default: Yopal (centro de acopio) }
        origen:
          $ref: "#/components/schemas/PuntoGeoJSON"
          description: Si se omite, se usa el primer punto de la geometría.
        distancia_km: { type: number, minimum: 0, maximum: 3000 }
        tiempo_horas: { type: number, minimum: 0, maximum: 72 }
        peajes_cop: { type: integer, minimum: 0, default: 0, description: Peajes de un camión en el trayecto. }
        factor_dificultad: { type: number, minimum: 1, maximum: 2, default: 1 }
        merma_pct: { type: number, minimum: 0, maximum: 15, default: 0 }
        geometria: { $ref: "#/components/schemas/LineaGeoJSON" }
        fuente: { $ref: "#/components/schemas/FuenteRuta" }
    RutaCambios:
      type: object
      minProperties: 1
      properties:
        distancia_km: { type: number, minimum: 0, maximum: 3000 }
        tiempo_horas: { type: number, minimum: 0, maximum: 72 }
        peajes_cop: { type: integer, minimum: 0 }
        factor_dificultad: { type: number, minimum: 1, maximum: 2 }
        merma_pct: { type: number, minimum: 0, maximum: 15 }
        geometria: { $ref: "#/components/schemas/LineaGeoJSON" }
        fuente: { $ref: "#/components/schemas/FuenteRuta" }
    Ruta:
      type: object
      required: [id, destino_id, origen_nombre, origen, distancia_km, tiempo_horas, peajes_cop, factor_dificultad, merma_pct, geometria, fuente, creado_en, actualizado_en]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        destino_id: { type: string, format: uuid }
        origen_nombre: { type: string, maxLength: 80 }
        origen: { $ref: "#/components/schemas/PuntoGeoJSON" }
        distancia_km: { type: number, minimum: 0, maximum: 3000 }
        tiempo_horas: { type: number, minimum: 0, maximum: 72 }
        peajes_cop: { type: integer, minimum: 0, description: Peajes de un camión en el trayecto. }
        factor_dificultad:
          type: number
          minimum: 1
          maximum: 2
          description: Recargo del flete por relieve y estado de la vía (1.00 = vía plana).
        merma_pct:
          type: number
          minimum: 0
          maximum: 15
          description: Pérdida de peso estimada del animal durante el viaje, en porcentaje.
        geometria: { $ref: "#/components/schemas/LineaGeoJSON" }
        fuente: { $ref: "#/components/schemas/FuenteRuta" }
        creado_en: { type: string, format: date-time, readOnly: true }
        actualizado_en: { type: string, format: date-time, readOnly: true }

    # ---------- Simulación ----------
    SimulacionEntrada:
      type: object
      required: [lote_id, flete_km_cop, destino_ids]
      properties:
        lote_id: { type: string, format: uuid }
        flete_km_cop:
          type: integer
          minimum: 1000
          maximum: 50000
          description: Valor del flete por kilómetro de un camión.
        capacidad_camion:
          type: integer
          minimum: 5
          maximum: 40
          default: 25
          description: Animales por camión (un ganadero de Yopal reporta 24 a 27).
        flete_incluye_peajes:
          type: boolean
          default: false
          description: Verdadero si el transportador paga los peajes dentro del flete.
        destino_ids:
          type: array
          description: Destinos a comparar. Cada uno genera una fila en resultado_simulacion.
          minItems: 2
          maxItems: 15
          uniqueItems: true
          items: { type: string, format: uuid }
    ResultadoSimulacion:
      type: object
      required: [id, simulacion_id, destino_id, ruta_id, distancia_km, tiempo_horas, merma_pct, camiones, peso_vendido_kg, precio_kg_cop, precio_fecha, precio_antiguedad_dias, advertencia, comision_cop, flete_cop, peajes_cop, costo_logistico_cop, ingreso_bruto_cop, utilidad_neta_cop, posicion, creado_en, actualizado_en]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        simulacion_id: { type: string, format: uuid }
        destino_id: { type: string, format: uuid }
        ruta_id: { type: string, format: uuid }
        distancia_km: { type: number, minimum: 0 }
        tiempo_horas: { type: number, minimum: 0 }
        merma_pct: { type: number, minimum: 0, maximum: 15 }
        camiones: { type: integer, minimum: 1 }
        peso_vendido_kg: { type: number, minimum: 0 }
        precio_kg_cop: { type: integer, minimum: 0 }
        precio_fecha: { type: string, format: date, description: Fecha del precio usado. }
        precio_antiguedad_dias: { type: integer, minimum: 0, description: Días entre la fecha del precio y la simulación. }
        advertencia:
          type: [string, "null"]
          description: Aviso si el precio tiene más de 7 días.
        comision_cop: { type: integer, minimum: 0 }
        flete_cop: { type: integer, minimum: 0 }
        peajes_cop: { type: integer, minimum: 0 }
        costo_logistico_cop: { type: integer, minimum: 0 }
        ingreso_bruto_cop: { type: integer, minimum: 0 }
        utilidad_neta_cop: { type: integer, description: Puede ser negativa si el costo supera el ingreso. }
        posicion: { type: integer, minimum: 1, description: 1 = destino con mayor utilidad. }
        creado_en: { type: string, format: date-time, readOnly: true }
        actualizado_en: { type: string, format: date-time, readOnly: true }
    Simulacion:
      type: object
      required: [id, lote_id, flete_km_cop, capacidad_camion, flete_incluye_peajes, mejor_destino_id, resultados, creado_en, actualizado_en]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        lote_id: { type: string, format: uuid }
        flete_km_cop: { type: integer, minimum: 1000, maximum: 50000 }
        capacidad_camion: { type: integer, minimum: 5, maximum: 40 }
        flete_incluye_peajes: { type: boolean }
        mejor_destino_id: { type: string, format: uuid }
        resultados:
          type: array
          description: Filas de resultado_simulacion, ordenadas por posicion.
          items: { $ref: "#/components/schemas/ResultadoSimulacion" }
        creado_en: { type: string, format: date-time, readOnly: true }
        actualizado_en: { type: string, format: date-time, readOnly: true }
    ListaSimulaciones:
      allOf:
        - $ref: "#/components/schemas/Paginacion"
        - type: object
          required: [datos]
          properties:
            datos:
              type: array
              items: { $ref: "#/components/schemas/Simulacion" }
