openapi: 3.1.0
info:
  title: API del Simulador de Destinos Ganaderos desde Yopal
  version: 0.3.0
  summary: Compara destinos de venta de un lote de ganado combinando precio por kilo, ruta, flete, peajes, comisión y merma.
  description: |
    Contrato de la API del proyecto (Entrega 3, Tecnologías Web 2026-B, Unitrópico).
    Este archivo es la fuente de verdad: la API lo carga al arrancar, valida cada petición
    con sus esquemas y se niega a iniciar si falta implementar alguna operación.

    Reglas comunes a toda la API:

    - Todas las fechas y horas se expresan en ISO 8601 con zona horaria.
    - Los valores monetarios son pesos colombianos (COP) enteros, sin decimales.
    - Las geometrías viajan en GeoJSON con coordenadas `[longitud, latitud]` (EPSG:4326).
    - Los listados grandes son paginados con `pagina` y `por_pagina` y devuelven `datos` + metadatos.
    - Todo error, sin excepción, responde con el esquema `Error`.
    - Las operaciones marcadas con candado exigen `Authorization: Bearer <token>`, obtenido en `POST /auth/ingreso`.
      La extensión `x-roles` indica qué roles pueden usarlas; si no aparece, basta con haber iniciado sesión.
    - Un productor solo ve y modifica sus propios lotes y simulaciones (autorización por objeto).
    - Vigencia de precios: cada resultado indica la fecha y la antigüedad del precio usado. Con más de 7 días
      se agrega una advertencia; con más de 30 días el destino no se compara (422). Los precios se cargan
      desde los reportes de Fedegán con `POST /precios/importacion`.

    Fórmula que aplica `POST /simulaciones` para cada destino:

    ```
    camiones            = techo(cantidad_animales / capacidad_camion)
    peso_vendido_kg     = peso_total_kg × (1 − merma_pct / 100)
    ingreso_bruto_cop   = peso_vendido_kg × precio_kg_cop
    comision_cop        = ingreso_bruto_cop × comision_pct / 100
    flete_cop           = distancia_km × flete_km_cop × factor_dificultad × camiones
    peajes_cop          = peajes_ruta × camiones   (0 si flete_incluye_peajes)
    costo_logistico_cop = flete_cop + peajes_cop + comision_cop
    utilidad_neta_cop   = ingreso_bruto_cop − costo_logistico_cop
    ```
  license:
    name: MIT
    identifier: MIT
servers:
  - url: /api/v1
    description: Este mismo servidor (el que muestra esta documentación, local o publicado)
  - url: http://localhost:3000/api/v1
    description: Servidor local (docker compose up)
security: []
tags:
  - name: Autenticación
    description: Registro, inicio de sesión y usuario actual.
  - name: Productores
    description: Personas que registran lotes para vender.
  - name: Lotes
    description: Grupos de animales que se quieren comercializar.
  - name: Destinos
    description: Venta en finca, subastas, ferias, frigoríficos y plantas de beneficio.
  - name: Precios
    description: Precio de compra por kilogramo en cada destino, por categoría y fecha.
  - name: Rutas
    description: Trayecto vial desde el origen (Yopal) hasta cada destino, con su geometría.
  - name: Simulaciones
    description: Cálculo comparativo de utilidad de un lote en varios destinos.
  - name: Sistema
    description: Estado del servicio.

paths:
  /salud:
    get:
      tags: [Sistema]
      operationId: verificarSalud
      summary: Indica si la API y la base de datos responden
      responses:
        "200":
          description: Servicio disponible
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Salud" }
              example: { estado: ok, base_datos: ok, version: 0.3.0 }
        "503": { $ref: "#/components/responses/NoDisponible" }

  /auth/registro:
    post:
      tags: [Autenticación]
      operationId: registrarUsuario
      summary: Crea una cuenta de productor
      description: Crea en una sola transacción el usuario (rol `productor`) y su ficha de productor. La contraseña se guarda cifrada con bcrypt.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegistroEntrada" }
            example:
              nombre_completo: Rosalba Guío Vargas
              correo: rosalba.guio@correo.co
              contrasena: sabana-tauramena-2026
              municipio: Tauramena
              telefono: "3114409862"
      responses:
        "201":
          description: Cuenta creada; ya puede iniciar sesión
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sesion" }
        "400": { $ref: "#/components/responses/PeticionInvalida" }
        "409":
          description: Ya existe una cuenta con ese correo
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                codigo: CONFLICTO
                mensaje: Ya existe una cuenta con ese correo.
                detalles:
                  - campo: correo
                    problema: Correo ya registrado.
        "422": { $ref: "#/components/responses/ValidacionFallida" }

  /auth/ingreso:
    post:
      tags: [Autenticación]
      operationId: iniciarSesion
      summary: Inicia sesión y entrega un token
      description: Limitado a 10 intentos por minuto por dirección IP.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IngresoEntrada" }
            example:
              correo: hernando.rincon@correo.co
              contrasena: la-contrasena-de-demostracion
      responses:
        "200":
          description: Sesión iniciada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sesion" }
              example:
                token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIuLi4ifQ.firma
                tipo: Bearer
                expira_en: 28800
                usuario:
                  id: 3a6f1c52-8d1e-4b8a-9c3e-2a7f5b9d1e01
                  nombre_completo: Hernando Rincón Barrera
                  correo: hernando.rincon@correo.co
                  rol: productor
                  productor_id: cd3b83ce-114a-5624-bde0-0c482a535db2
                  creado_en: "2026-09-10T09:00:00-05:00"
                  actualizado_en: "2026-09-10T09:00:00-05:00"
        "400": { $ref: "#/components/responses/PeticionInvalida" }
        "401":
          description: Correo o contraseña incorrectos
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                codigo: NO_AUTENTICADO
                mensaje: Correo o contraseña incorrectos.
                detalles: []
        "422": { $ref: "#/components/responses/ValidacionFallida" }
        "429": { $ref: "#/components/responses/DemasiadasSolicitudes" }

  /auth/yo:
    get:
      tags: [Autenticación]
      operationId: obtenerUsuarioActual
      summary: Datos del usuario de la sesión
      security: [{ bearer: [] }]
      responses:
        "200":
          description: Usuario actual
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Usuario" }
        "401": { $ref: "#/components/responses/NoAutenticado" }

  /productores:
    get:
      tags: [Productores]
      operationId: listarProductores
      summary: Lista los productores registrados
      security: [{ bearer: [] }]
      x-roles: [administrador]
      parameters:
        - $ref: "#/components/parameters/Pagina"
        - $ref: "#/components/parameters/PorPagina"
        - name: municipio
          in: query
          description: Filtra por municipio de residencia.
          schema: { type: string, maxLength: 60 }
          example: Yopal
      responses:
        "200":
          description: Página de productores
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListaProductores" }
        "400": { $ref: "#/components/responses/PeticionInvalida" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/Prohibido" }
    post:
      tags: [Productores]
      operationId: crearProductor
      summary: Registra un productor sin cuenta de usuario
      description: Útil para que un administrador registre a un ganadero que no usa la aplicación.
      security: [{ bearer: [] }]
      x-roles: [administrador]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductorEntrada" }
            example:
              nombre_completo: Luz Marina Cárdenas Pérez
              municipio: Aguazul
              telefono: "3208841325"
              correo: null
      responses:
        "201":
          description: Productor creado
          headers:
            Location: { $ref: "#/components/headers/Location" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Productor" }
        "400": { $ref: "#/components/responses/PeticionInvalida" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/Prohibido" }
        "409": { $ref: "#/components/responses/Conflicto" }
        "422": { $ref: "#/components/responses/ValidacionFallida" }

  /productores/{productor_id}:
    parameters:
      - $ref: "#/components/parameters/ProductorId"
    get:
      tags: [Productores]
      operationId: obtenerProductor
      summary: Obtiene un productor (el propio, o cualquiera si es administrador)
      security: [{ bearer: [] }]
      responses:
        "200":
          description: Productor encontrado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Productor" }
              example:
                id: cd3b83ce-114a-5624-bde0-0c482a535db2
                nombre_completo: Hernando Rincón Barrera
                municipio: Yopal
                telefono: "3124587710"
                correo: hernando.rincon@correo.co
                creado_en: "2026-09-10T09:00:00-05:00"
                actualizado_en: "2026-09-10T09:00:00-05:00"
        "400": { $ref: "#/components/responses/PeticionInvalida" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/Prohibido" }
        "404": { $ref: "#/components/responses/NoEncontrado" }
    patch:
      tags: [Productores]
      operationId: actualizarProductor
      summary: Modifica datos de un productor (el propio, o cualquiera si es administrador)
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductorCambios" }
            example: { telefono: "3124587799" }
      responses:
        "200":
          description: Productor actualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Productor" }
        "400": { $ref: "#/components/responses/PeticionInvalida" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/Prohibido" }
        "404": { $ref: "#/components/responses/NoEncontrado" }
        "409": { $ref: "#/components/responses/Conflicto" }
        "422": { $ref: "#/components/responses/ValidacionFallida" }
    delete:
      tags: [Productores]
      operationId: eliminarProductor
      summary: Elimina un productor que no tiene lotes
      security: [{ bearer: [] }]
      x-roles: [administrador]
      responses:
        "204": { description: Productor eliminado }
        "400": { $ref: "#/components/responses/PeticionInvalida" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/Prohibido" }
        "404": { $ref: "#/components/responses/NoEncontrado" }
        "409": { $ref: "#/components/responses/Conflicto" }

  /lotes:
    get:
      tags: [Lotes]
      operationId: listarLotes
      summary: Lista los lotes del productor de la sesión (todos, si es administrador)
      security: [{ bearer: [] }]
      parameters:
        - $ref: "#/components/parameters/Pagina"
        - $ref: "#/components/parameters/PorPagina"
        - name: productor_id
          in: query
          description: Solo para administradores; un productor siempre ve los suyos.
          schema: { type: string, format: uuid }
        - name: estado
          in: query
          schema: { $ref: "#/components/schemas/EstadoLote" }
        - name: categoria
          in: query
          schema: { $ref: "#/components/schemas/Categoria" }
        - name: orden
          in: query
          description: Campo de ordenamiento; el prefijo `-` indica descendente.
          schema:
            type: string
            enum: [creado_en, -creado_en, peso_total_kg, -peso_total_kg]
            default: -creado_en
      responses:
        "200":
          description: Página de lotes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListaLotes" }
              examples:
                vacio:
                  summary: Sin lotes que coincidan con el filtro
                  value: { datos: [], pagina: 1, por_pagina: 20, total: 0 }
        "400": { $ref: "#/components/responses/PeticionInvalida" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
    post:
      tags: [Lotes]
      operationId: crearLote
      summary: Registra un lote ganadero
      description: |
        El servidor calcula `peso_total_kg` y asigna `estado = disponible`.
        Un productor puede omitir `productor_id` (se usa el suyo); un administrador debe enviarlo.
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoteEntrada" }
            example:
              nombre: Novillos cebados de octubre
              cantidad_animales: 30
              peso_promedio_kg: 452.0
              categoria: novillo_gordo
              raza: Brahman comercial
              finca: Finca La Esperanza
              municipio_origen: Yopal
      responses:
        "201":
          description: Lote creado
          headers:
            Location: { $ref: "#/components/headers/Location" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Lote" }
              examples:
                creado: { $ref: "#/components/examples/LoteNovillos" }
        "400": { $ref: "#/components/responses/PeticionInvalida" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/Prohibido" }
        "422":
          description: Algún campo no cumple las reglas del lote
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                codigo: VALIDACION_FALLIDA
                mensaje: Hay campos con valores no permitidos.
                detalles:
                  - campo: cantidad_animales
                    problema: Debe ser menor o igual a 200.
                  - campo: peso_promedio_kg
                    problema: Falta el campo.

  /lotes/{lote_id}:
    parameters:
      - $ref: "#/components/parameters/LoteId"
    get:
      tags: [Lotes]
      operationId: obtenerLote
      summary: Obtiene un lote propio
      security: [{ bearer: [] }]
      responses:
        "200":
          description: Lote encontrado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Lote" }
              examples:
                lote: { $ref: "#/components/examples/LoteNovillos" }
        "400": { $ref: "#/components/responses/PeticionInvalida" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/Prohibido" }
        "404": { $ref: "#/components/responses/NoEncontrado" }
    patch:
      tags: [Lotes]
      operationId: actualizarLote
      summary: Modifica uno o varios campos de un lote propio
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoteCambios" }
            example: { cantidad_animales: 28, peso_promedio_kg: 458.0 }
      responses:
        "200":
          description: Lote actualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Lote" }
        "400": { $ref: "#/components/responses/PeticionInvalida" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/Prohibido" }
        "404": { $ref: "#/components/responses/NoEncontrado" }
        "422": { $ref: "#/components/responses/ValidacionFallida" }
    delete:
      tags: [Lotes]
      operationId: eliminarLote
      summary: Elimina un lote propio que aún no tiene simulaciones
      security: [{ bearer: [] }]
      responses:
        "204": { description: Lote eliminado }
        "400": { $ref: "#/components/responses/PeticionInvalida" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/Prohibido" }
        "404": { $ref: "#/components/responses/NoEncontrado" }
        "409":
          description: El lote tiene simulaciones asociadas y no se puede eliminar
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                codigo: CONFLICTO
                mensaje: El lote tiene 2 simulaciones guardadas. Márquelo como vendido en lugar de eliminarlo.
                detalles: []

  /destinos:
    get:
      tags: [Destinos]
      operationId: listarDestinos
      summary: Lista los destinos de comercialización
      description: |
        Si se envían `cerca_lat`, `cerca_lon` y `radio_km`, solo devuelve destinos dentro de ese radio
        (consulta espacial `ST_DWithin` de PostGIS) y agrega `distancia_lineal_km`, ordenando del más cercano al más lejano.
      parameters:
        - $ref: "#/components/parameters/Pagina"
        - $ref: "#/components/parameters/PorPagina"
        - name: tipo
          in: query
          schema: { $ref: "#/components/schemas/TipoDestino" }
        - name: departamento
          in: query
          schema: { type: string, maxLength: 60 }
          example: Casanare
        - name: activo
          in: query
          schema: { type: boolean, default: true }
        - name: cerca_lat
          in: query
          schema: { type: number, minimum: -4.3, maximum: 13.5 }
          example: 5.3371
        - name: cerca_lon
          in: query
          schema: { type: number, minimum: -82, maximum: -66 }
          example: -72.3959
        - name: radio_km
          in: query
          schema: { type: number, exclusiveMinimum: 0, maximum: 1500 }
          example: 300
      responses:
        "200":
          description: Página de destinos
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListaDestinos" }
              example:
                datos:
                  - id: acca0ef8-f855-5505-b81b-25833e792ff1
                    nombre: Subasta Ganadera de Yopal
                    tipo: subasta
                    municipio: Yopal
                    departamento: Casanare
                    ubicacion: { type: Point, coordinates: [-72.4102, 5.3265] }
                    comision_pct: 3.0
                    activo: true
                    creado_en: "2026-09-01T08:00:00-05:00"
                    actualizado_en: "2026-09-01T08:00:00-05:00"
                pagina: 1
                por_pagina: 20
                total: 1
        "400": { $ref: "#/components/responses/PeticionInvalida" }
        "422":
          description: Filtro espacial incompleto
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                codigo: VALIDACION_FALLIDA
                mensaje: El filtro espacial requiere cerca_lat, cerca_lon y radio_km juntos.
                detalles:
                  - campo: radio_km
                    problema: Falta el parámetro.
    post:
      tags: [Destinos]
      operationId: crearDestino
      summary: Agrega un destino
      security: [{ bearer: [] }]
      x-roles: [administrador]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DestinoEntrada" }
            example:
              nombre: Subasta Ganadera de Aguazul
              tipo: subasta
              municipio: Aguazul
              departamento: Casanare
              ubicacion: { type: Point, coordinates: [-72.5471, 5.1731] }
              comision_pct: 3.0
      responses:
        "201":
          description: Destino creado
          headers:
            Location: { $ref: "#/components/headers/Location" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Destino" }
        "400": { $ref: "#/components/responses/PeticionInvalida" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/Prohibido" }
        "409": { $ref: "#/components/responses/Conflicto" }
        "422": { $ref: "#/components/responses/ValidacionFallida" }

  /destinos/{destino_id}:
    parameters:
      - $ref: "#/components/parameters/DestinoId"
    get:
      tags: [Destinos]
      operationId: obtenerDestino
      summary: Obtiene un destino
      responses:
        "200":
          description: Destino encontrado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Destino" }
        "400": { $ref: "#/components/responses/PeticionInvalida" }
        "404": { $ref: "#/components/responses/NoEncontrado" }
    patch:
      tags: [Destinos]
      operationId: actualizarDestino
      summary: Modifica un destino (por ejemplo, desactivarlo o cambiar su comisión)
      security: [{ bearer: [] }]
      x-roles: [administrador]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DestinoCambios" }
            example: { comision_pct: 2.5 }
      responses:
        "200":
          description: Destino actualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Destino" }
        "400": { $ref: "#/components/responses/PeticionInvalida" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/Prohibido" }
        "404": { $ref: "#/components/responses/NoEncontrado" }
        "409": { $ref: "#/components/responses/Conflicto" }
        "422": { $ref: "#/components/responses/ValidacionFallida" }
    delete:
      tags: [Destinos]
      operationId: eliminarDestino
      summary: Elimina un destino que no aparece en ninguna simulación
      description: Si ya fue usado en simulaciones responde 409; en ese caso se desactiva con PATCH `activo = false`.
      security: [{ bearer: [] }]
      x-roles: [administrador]
      responses:
        "204": { description: "Destino eliminado junto con sus precios y rutas" }
        "400": { $ref: "#/components/responses/PeticionInvalida" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/Prohibido" }
        "404": { $ref: "#/components/responses/NoEncontrado" }
        "409": { $ref: "#/components/responses/Conflicto" }

  /destinos/{destino_id}/precios:
    parameters:
      - $ref: "#/components/parameters/DestinoId"
    get:
      tags: [Precios]
      operationId: listarPreciosDestino
      summary: Historial de precios por kilogramo de un destino
      parameters:
        - name: categoria
          in: query
          schema: { $ref: "#/components/schemas/Categoria" }
        - name: desde
          in: query
          schema: { type: string, format: date }
          example: "2026-09-01"
        - name: hasta
          in: query
          schema: { type: string, format: date }
          example: "2026-10-31"
      responses:
        "200":
          description: Precios del destino ordenados por fecha descendente
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PrecioMercado" }
        "400": { $ref: "#/components/responses/PeticionInvalida" }
        "404": { $ref: "#/components/responses/NoEncontrado" }
    post:
      tags: [Precios]
      operationId: registrarPrecio
      summary: Registra el precio del día para una categoría en el destino
      security: [{ bearer: [] }]
      x-roles: [administrador]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PrecioMercadoEntrada" }
            example:
              categoria: novillo_gordo
              precio_kg_cop: 11350
              fecha: "2026-10-12"
              fuente: Llamada telefónica al comprador del frigorífico
      responses:
        "201":
          description: Precio registrado
          headers:
            Location: { $ref: "#/components/headers/Location" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PrecioMercado" }
        "400": { $ref: "#/components/responses/PeticionInvalida" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/Prohibido" }
        "404": { $ref: "#/components/responses/NoEncontrado" }
        "409":
          description: Ya existe un precio para esa categoría, destino y fecha
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                codigo: CONFLICTO
                mensaje: Ya hay un precio de novillo_gordo para ese destino en esa fecha.
                detalles:
                  - campo: fecha
                    problema: Combinación destino + categoría + fecha repetida.
        "422": { $ref: "#/components/responses/ValidacionFallida" }

  /precios/{precio_id}:
    parameters:
      - name: precio_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [Precios]
      operationId: actualizarPrecio
      summary: Corrige un precio registrado
      security: [{ bearer: [] }]
      x-roles: [administrador]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PrecioMercadoCambios" }
            example: { precio_kg_cop: 11400, fuente: Boletín semanal de la subasta }
      responses:
        "200":
          description: Precio actualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PrecioMercado" }
        "400": { $ref: "#/components/responses/PeticionInvalida" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/Prohibido" }
        "404": { $ref: "#/components/responses/NoEncontrado" }
        "409": { $ref: "#/components/responses/Conflicto" }
        "422": { $ref: "#/components/responses/ValidacionFallida" }
    delete:
      tags: [Precios]
      operationId: eliminarPrecio
      summary: Elimina un precio registrado por error
      description: Las simulaciones ya guardadas no cambian, porque conservan copia del precio usado.
      security: [{ bearer: [] }]
      x-roles: [administrador]
      responses:
        "204": { description: Precio eliminado }
        "400": { $ref: "#/components/responses/PeticionInvalida" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/Prohibido" }
        "404": { $ref: "#/components/responses/NoEncontrado" }

  /precios/importacion:
    post:
      tags: [Precios]
      operationId: importarPrecios
      summary: Carga precios por lotes desde una hoja CSV (reportes de Fedegán)
      description: |
        Recibe un CSV (separado por coma o punto y coma) con las columnas
        `destino, categoria, precio_kg_cop, fecha, fuente` y opcionalmente `referencia`.
        `destino` es el nombre exacto del destino o su id. Si ya existe un precio para el mismo destino,
        categoría y fecha, se actualiza. Es todo o nada: si una fila tiene errores no se guarda ninguna
        y la respuesta 422 indica fila y campo.
      security: [{ bearer: [] }]
      x-roles: [administrador]
      requestBody:
        required: true
        content:
          text/csv:
            schema: { type: string }
            example: |
              destino,categoria,precio_kg_cop,fecha,fuente,referencia
              Frigorífico Guadalupe,novillo_gordo,11350,2026-10-09,Fedegán – precios semanales de ganado gordo,Planta Guadalupe (Bogotá)
              Subasta Ganadera de Yopal,novillo_gordo,10450,2026-10-09,Fedegán – precios semanales en subastas,Subastas Llanos Orientales
      responses:
        "201":
          description: Precios importados
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportacionPrecios" }
              example:
                id: 3c9a7e10-4b2d-4e8f-9a61-0d2c4b6e8f10
                fuente: Fedegán – precios semanales de ganado gordo
                origen: manual
                filas: 22
                insertados: 18
                actualizados: 3
                sin_cambios: 1
                usuario_id: 3a6f1c52-8d1e-4b8a-9c3e-2a7f5b9d1e01
                creado_en: "2026-10-12T07:10:00-05:00"
                actualizado_en: "2026-10-12T07:10:00-05:00"
        "400": { $ref: "#/components/responses/PeticionInvalida" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/Prohibido" }
        "422":
          description: Alguna fila tiene errores; no se guardó nada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                codigo: VALIDACION_FALLIDA
                mensaje: El archivo tiene 2 problema(s); no se guardó ningún precio.
                detalles:
                  - campo: fila 3.destino
                    problema: No existe un destino llamado «Frigorifico Guadalupe».
                  - campo: fila 5.precio_kg_cop
                    problema: Debe estar entre 3.000 y 30.000 pesos por kilo.

  /precios/importaciones:
    get:
      tags: [Precios]
      operationId: listarImportacionesPrecios
      summary: Últimas 20 cargas de precios, de la más reciente a la más antigua
      security: [{ bearer: [] }]
      x-roles: [administrador]
      responses:
        "200":
          description: Historial de cargas
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ImportacionPrecios" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/Prohibido" }

  /rutas:
    get:
      tags: [Rutas]
      operationId: listarRutas
      summary: Lista las rutas con su geometría
      description: |
        Las rutas medidas salen de Yopal (`origen_nombre = "Yopal (centro de acopio)"`). Cuando se simula un lote
        de otro municipio de Casanare, el servidor crea la ruta desde ese municipio (con OSRM o, si no responde,
        estimada en línea recta) y la guarda con su `fuente`.
      parameters:
        - name: destino_id
          in: query
          schema: { type: string, format: uuid }
        - name: origen
          in: query
          description: Nombre exacto del origen, por ejemplo `Yopal (centro de acopio)` o `Aguazul`.
          schema: { type: string, minLength: 2, maxLength: 80 }
        - name: max_distancia_km
          in: query
          schema: { type: number, exclusiveMinimum: 0 }
          example: 400
      responses:
        "200":
          description: Rutas encontradas, de la más corta a la más larga
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Ruta" }
        "400": { $ref: "#/components/responses/PeticionInvalida" }
    post:
      tags: [Rutas]
      operationId: crearRuta
      summary: Registra la ruta hacia un destino
      security: [{ bearer: [] }]
      x-roles: [administrador]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RutaEntrada" }
      responses:
        "201":
          description: Ruta creada
          headers:
            Location: { $ref: "#/components/headers/Location" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ruta" }
        "400": { $ref: "#/components/responses/PeticionInvalida" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/Prohibido" }
        "404": { $ref: "#/components/responses/NoEncontrado" }
        "409": { $ref: "#/components/responses/Conflicto" }
        "422": { $ref: "#/components/responses/ValidacionFallida" }

  /rutas/{ruta_id}:
    parameters:
      - name: ruta_id
        in: path
        required: true
        schema: { type: string, format: uuid }
        example: 5ec2ea46-db9d-525b-8417-462de2b24a6a
    get:
      tags: [Rutas]
      operationId: obtenerRuta
      summary: Obtiene una ruta con su geometría GeoJSON
      responses:
        "200":
          description: Ruta encontrada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ruta" }
              examples:
                villavicencio: { $ref: "#/components/examples/RutaVillavicencio" }
        "400": { $ref: "#/components/responses/PeticionInvalida" }
        "404": { $ref: "#/components/responses/NoEncontrado" }
    patch:
      tags: [Rutas]
      operationId: actualizarRuta
      summary: Corrige datos de una ruta (peajes, merma, distancia…)
      security: [{ bearer: [] }]
      x-roles: [administrador]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RutaCambios" }
            example: { merma_pct: 7.0, peajes_cop: 90000 }
      responses:
        "200":
          description: Ruta actualizada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ruta" }
        "400": { $ref: "#/components/responses/PeticionInvalida" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/Prohibido" }
        "404": { $ref: "#/components/responses/NoEncontrado" }
        "422": { $ref: "#/components/responses/ValidacionFallida" }
    delete:
      tags: [Rutas]
      operationId: eliminarRuta
      summary: Elimina una ruta que no aparece en ninguna simulación
      security: [{ bearer: [] }]
      x-roles: [administrador]
      responses:
        "204": { description: Ruta eliminada }
        "400": { $ref: "#/components/responses/PeticionInvalida" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/Prohibido" }
        "404": { $ref: "#/components/responses/NoEncontrado" }
        "409": { $ref: "#/components/responses/Conflicto" }

  /simulaciones:
    get:
      tags: [Simulaciones]
      operationId: listarSimulaciones
      summary: Historial de simulaciones del productor de la sesión (todas, si es administrador)
      security: [{ bearer: [] }]
      parameters:
        - $ref: "#/components/parameters/Pagina"
        - $ref: "#/components/parameters/PorPagina"
        - name: lote_id
          in: query
          schema: { type: string, format: uuid }
        - name: desde
          in: query
          schema: { type: string, format: date }
          example: "2026-09-01"
      responses:
        "200":
          description: Página de simulaciones, de la más reciente a la más antigua
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListaSimulaciones" }
        "400": { $ref: "#/components/responses/PeticionInvalida" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
    post:
      tags: [Simulaciones]
      operationId: crearSimulacion
      summary: Calcula y guarda la comparación de destinos para un lote propio
      description: |
        Calcula la utilidad neta del lote en cada destino de `destino_ids`, ordena los resultados
        de mayor a menor utilidad (`posicion` 1 es el mejor) y guarda `mejor_destino_id`.
        El cliente nunca envía resultados: el servidor calcula con sus propios precios y rutas.
        Usa la ruta desde el `municipio_origen` del lote. Si ese municipio es de Casanare y aún no tiene ruta
        hacia el destino, la calcula (OSRM o estimación en línea recta × sinuosidad, con merma y peajes
        interpolados por distancia) y la guarda; `ruta_id` permite consultar su `fuente`.
        Responde 422 si algún destino no tiene precio vigente para la categoría del lote o no tiene ruta.
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SimulacionEntrada" }
            example:
              lote_id: 9bad2b17-c8e0-57f7-ac48-2d1cf99ad088
              flete_km_cop: 7000
              capacidad_camion: 25
              flete_incluye_peajes: false
              destino_ids:
                - 0e6f6c1a-3b0d-5c8e-9f1a-6d2b7c4e8a10
                - acca0ef8-f855-5505-b81b-25833e792ff1
                - 52bbc2f4-901c-5ff0-a08a-5f8f08f91fa1
      responses:
        "201":
          description: Simulación calculada y guardada
          headers:
            Location: { $ref: "#/components/headers/Location" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Simulacion" }
              examples:
                novillos: { $ref: "#/components/examples/SimulacionNovillos" }
        "400": { $ref: "#/components/responses/PeticionInvalida" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/Prohibido" }
        "404":
          description: El lote no existe
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                codigo: NO_ENCONTRADO
                mensaje: No existe un lote con id 00000000-0000-4000-8000-000000000000.
                detalles:
                  - campo: lote_id
                    problema: Lote inexistente.
        "422":
          description: Los datos no permiten calcular la simulación
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                codigo: VALIDACION_FALLIDA
                mensaje: No se puede calcular la utilidad para uno de los destinos elegidos.
                detalles:
                  - campo: destino_ids[2]
                    problema: Frigorífico Guadalupe no tiene precio vigente para novillo_levante.

  /simulaciones/{simulacion_id}:
    parameters:
      - name: simulacion_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Simulaciones]
      operationId: obtenerSimulacion
      summary: Obtiene una simulación propia con el desglose por destino
      security: [{ bearer: [] }]
      responses:
        "200":
          description: Simulación encontrada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Simulacion" }
              examples:
                novillos: { $ref: "#/components/examples/SimulacionNovillos" }
        "400": { $ref: "#/components/responses/PeticionInvalida" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/Prohibido" }
        "404": { $ref: "#/components/responses/NoEncontrado" }
    delete:
      tags: [Simulaciones]
      operationId: eliminarSimulacion
      summary: Elimina una simulación propia del historial
      security: [{ bearer: [] }]
      responses:
        "204": { description: Simulación eliminada con sus resultados }
        "400": { $ref: "#/components/responses/PeticionInvalida" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/Prohibido" }
        "404": { $ref: "#/components/responses/NoEncontrado" }

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token obtenido en POST /auth/ingreso. Dura 8 horas.

  parameters:
    Pagina:
      name: pagina
      in: query
      description: Número de página, empezando en 1.
      schema: { type: integer, minimum: 1, default: 1 }
    PorPagina:
      name: por_pagina
      in: query
      description: Registros por página.
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    ProductorId:
      name: productor_id
      in: path
      required: true
      schema: { type: string, format: uuid }
      example: cd3b83ce-114a-5624-bde0-0c482a535db2
    LoteId:
      name: lote_id
      in: path
      required: true
      schema: { type: string, format: uuid }
      example: 9bad2b17-c8e0-57f7-ac48-2d1cf99ad088
    DestinoId:
      name: destino_id
      in: path
      required: true
      schema: { type: string, format: uuid }
      example: 52bbc2f4-901c-5ff0-a08a-5f8f08f91fa1

  headers:
    Location:
      description: URL del recurso recién creado.
      schema: { type: string, format: uri-reference }

  responses:
    PeticionInvalida:
      description: La petición está mal formada (JSON inválido, parámetro con tipo equivocado o UUID mal escrito)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            codigo: PETICION_INVALIDA
            mensaje: Hay parámetros con formato no válido.
            detalles:
              - campo: lote_id
                problema: Debe ser un UUID válido.
    NoAutenticado:
      description: Falta el token, está vencido o es inválido
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            codigo: NO_AUTENTICADO
            mensaje: Debe iniciar sesión para usar esta operación.
            detalles: []
    Prohibido:
      description: La sesión es válida pero no tiene permiso sobre este recurso
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            codigo: PROHIBIDO
            mensaje: No tiene permiso sobre este lote.
            detalles: []
    NoEncontrado:
      description: El recurso no existe
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            codigo: NO_ENCONTRADO
            mensaje: El recurso solicitado no existe.
            detalles: []
    Conflicto:
      description: La operación choca con datos existentes (duplicado, o el recurso está en uso)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            codigo: CONFLICTO
            mensaje: El destino aparece en simulaciones guardadas. Desactívelo en lugar de eliminarlo.
            detalles: []
    ValidacionFallida:
      description: El cuerpo es JSON válido pero algún campo incumple las reglas de negocio
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            codigo: VALIDACION_FALLIDA
            mensaje: Hay campos con valores no permitidos.
            detalles:
              - campo: precio_kg_cop
                problema: Debe ser mayor o igual a 3000.
    DemasiadasSolicitudes:
      description: Se superó el límite de intentos
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            codigo: DEMASIADAS_SOLICITUDES
            mensaje: Demasiados intentos. Espere un minuto y vuelva a intentar.
            detalles: []
    NoDisponible:
      description: La base de datos no responde
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            codigo: SERVICIO_EXTERNO_NO_DISPONIBLE
            mensaje: La base de datos no responde.
            detalles: []

  examples:
    LoteNovillos:
      summary: Lote de 30 novillos en Yopal
      value:
        id: 9bad2b17-c8e0-57f7-ac48-2d1cf99ad088
        productor_id: cd3b83ce-114a-5624-bde0-0c482a535db2
        nombre: Novillos cebados de septiembre
        cantidad_animales: 30
        peso_promedio_kg: 452.0
        peso_total_kg: 13560.0
        categoria: novillo_gordo
        raza: Brahman comercial
        finca: Finca La Esperanza
        municipio_origen: Yopal
        estado: disponible
        creado_en: "2026-09-14T07:30:00-05:00"
        actualizado_en: "2026-09-14T07:30:00-05:00"
    RutaVillavicencio:
      summary: Ruta Yopal → Villavicencio por la Marginal de la Selva
      value:
        id: 5ec2ea46-db9d-525b-8417-462de2b24a6a
        destino_id: 6b8211cf-49f9-5354-925a-ec5edb230ee1
        origen_nombre: Yopal (centro de acopio)
        origen: { type: Point, coordinates: [-72.3959, 5.3371] }
        distancia_km: 266.0
        tiempo_horas: 5.1
        peajes_cop: 85000
        factor_dificultad: 1.1
        merma_pct: 6.5
        geometria:
          type: LineString
          coordinates: [[-72.3959, 5.3371], [-72.5471, 5.1731], [-72.8958, 4.8766], [-72.9281, 4.6094], [-72.9654, 4.5756], [-73.4868, 4.2699], [-73.6266, 4.142]]
        fuente: manual
        creado_en: "2026-09-01T08:00:00-05:00"
        actualizado_en: "2026-10-11T10:15:00-05:00"
    SimulacionNovillos:
      summary: 30 novillos (13.560 kg) en 2 camiones, flete de 7.000 COP/km, 3 destinos
      value:
        id: d014a3b6-e98c-5057-a5c1-37dcf2aebb6b
        lote_id: 9bad2b17-c8e0-57f7-ac48-2d1cf99ad088
        flete_km_cop: 7000
        capacidad_camion: 25
        flete_incluye_peajes: false
        mejor_destino_id: 0e6f6c1a-3b0d-5c8e-9f1a-6d2b7c4e8a10
        creado_en: "2026-10-12T08:25:00-05:00"
        actualizado_en: "2026-10-12T08:25:00-05:00"
        resultados:
          - id: 1f0c7a1e-0a7b-4c1e-9d5a-1b2c3d4e5f60
            simulacion_id: d014a3b6-e98c-5057-a5c1-37dcf2aebb6b
            destino_id: 0e6f6c1a-3b0d-5c8e-9f1a-6d2b7c4e8a10
            ruta_id: 7b1e2d3c-4a5b-5c6d-8e7f-9a0b1c2d3e4f
            distancia_km: 0.0
            tiempo_horas: 0.0
            merma_pct: 0.0
            camiones: 2
            peso_vendido_kg: 13560.0
            precio_kg_cop: 10100
            precio_fecha: "2026-10-09"
            precio_antiguedad_dias: 3
            advertencia: null
            comision_cop: 0
            flete_cop: 0
            peajes_cop: 0
            costo_logistico_cop: 0
            ingreso_bruto_cop: 136956000
