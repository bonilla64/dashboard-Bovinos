openapi: 3.1.0
info:
  title: API del Simulador de Destinos Ganaderos desde Yopal
  version: 0.2.0
  summary: Compara destinos de venta de un lote de ganado combinando precio por kilo, ruta, flete, peajes y merma.
  description: |
    Contrato de la API del proyecto (Entrega 2, Tecnologías Web 2026-B, Unitrópico).

    Reglas comunes a toda la API:

    - Todas las fechas y horas se expresan en ISO 8601 con zona horaria de Colombia (`-05:00`).
    - Los valores monetarios son pesos colombianos (COP) enteros, sin decimales.
    - Las geometrías viajan en GeoJSON con coordenadas `[longitud, latitud]` (EPSG:4326).
    - Los listados son paginados con `pagina` y `por_pagina` y devuelven el objeto `datos` + metadatos.
    - Todo error, sin excepción, responde con el esquema `Error`.

    Fórmula que aplica `POST /simulaciones` para cada destino:

    ```
    peso_vendido_kg      = peso_total_kg × (1 − merma_pct / 100)
    flete_cop            = distancia_km × flete_km_cop × factor_dificultad
    costo_logistico_cop  = flete_cop + peajes_cop
    ingreso_bruto_cop    = peso_vendido_kg × precio_kg_cop
    utilidad_neta_cop    = ingreso_bruto_cop − costo_logistico_cop
    ```
  license:
    name: MIT
    identifier: MIT
servers:
  - url: http://localhost:3000/api/v1
    description: Servidor local (se implementa en la Entrega 3)
  - url: http://127.0.0.1:4010
    description: Servidor simulado con Prism (npx @stoplight/prism-cli mock api/openapi.yaml)
# Sin autenticación en la Entrega 2. En la Entrega 3 se agrega un esquema bearer (JWT)
# para las operaciones de escritura; ver docs/decisiones.md (D-07).
security: []
tags:
  - name: Productores
    description: Personas que registran lotes para vender.
  - name: Lotes
    description: Grupos de animales que se quieren comercializar.
  - name: Destinos
    description: Subastas, ferias, frigoríficos y plantas de beneficio candidatos.
  - name: Precios
    description: Precio de compra por kilogramo en cada destino, por categoría y fecha.
  - name: Rutas
    description: Trayecto vial desde el origen (Yopal) hasta cada destino, con su geometría.
  - name: Simulaciones
    description: Cálculo comparativo de utilidad de un lote en varios destinos.

paths:
  /productores:
    get:
      tags: [Productores]
      operationId: listarProductores
      summary: Lista los productores registrados
      parameters:
        - $ref: "#/components/parameters/Pagina"
        - $ref: "#/components/parameters/PorPagina"
        - name: municipio
          in: query
          description: Filtra por municipio de residencia.
          schema: { type: string, maxLength: 60 }
          example: Yopal
      responses:
        "200":
          description: Página de productores
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListaProductores" }
              example:
                datos:
                  - id: cd3b83ce-114a-5624-bde0-0c482a535db2
                    nombre_completo: Hernando Rincón Barrera
                    municipio: Yopal
                    telefono: "3124587710"
                    correo: hernando.rincon@correo.co
                    creado_en: "2026-09-10T09:00:00-05:00"
                    actualizado_en: "2026-09-10T09:00:00-05:00"
                pagina: 1
                por_pagina: 20
                total: 1
        "400": { $ref: "#/components/responses/PeticionInvalida" }
    post:
      tags: [Productores]
      operationId: crearProductor
      summary: Registra un productor
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductorEntrada" }
            example:
              nombre_completo: Luz Marina Cárdenas Pérez
              municipio: Aguazul
              telefono: "3208841325"
              correo: null
      responses:
        "201":
          description: Productor creado
          headers:
            Location: { $ref: "#/components/headers/Location" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Productor" }
              example:
                id: 2f3b8c51-6c0e-5b1a-9d77-0a3f4a1b2c11
                nombre_completo: Luz Marina Cárdenas Pérez
                municipio: Aguazul
                telefono: "3208841325"
                correo: null
                creado_en: "2026-09-29T10:12:00-05:00"
                actualizado_en: "2026-09-29T10:12:00-05:00"
        "400": { $ref: "#/components/responses/PeticionInvalida" }
        "422": { $ref: "#/components/responses/ValidacionFallida" }

  /productores/{productor_id}:
    parameters:
      - $ref: "#/components/parameters/ProductorId"
    get:
      tags: [Productores]
      operationId: obtenerProductor
      summary: Obtiene un productor
      responses:
        "200":
          description: Productor encontrado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Productor" }
              example:
                id: cd3b83ce-114a-5624-bde0-0c482a535db2
                nombre_completo: Hernando Rincón Barrera
                municipio: Yopal
                telefono: "3124587710"
                correo: hernando.rincon@correo.co
                creado_en: "2026-09-10T09:00:00-05:00"
                actualizado_en: "2026-09-10T09:00:00-05:00"
        "400": { $ref: "#/components/responses/PeticionInvalida" }
        "404": { $ref: "#/components/responses/NoEncontrado" }

  /lotes:
    get:
      tags: [Lotes]
      operationId: listarLotes
      summary: Lista los lotes, con filtros
      parameters:
        - $ref: "#/components/parameters/Pagina"
        - $ref: "#/components/parameters/PorPagina"
        - name: productor_id
          in: query
          schema: { type: string, format: uuid }
        - name: estado
          in: query
          schema: { $ref: "#/components/schemas/EstadoLote" }
        - name: categoria
          in: query
          schema: { $ref: "#/components/schemas/Categoria" }
        - name: orden
          in: query
          description: Campo de ordenamiento; el prefijo `-` indica descendente.
          schema:
            type: string
            enum: [creado_en, -creado_en, peso_total_kg, -peso_total_kg]
            default: -creado_en
      responses:
        "200":
          description: Página de lotes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListaLotes" }
              examples:
                conDatos:
                  summary: Un lote de novillos en Yopal
                  value:
                    datos:
                      - id: 9bad2b17-c8e0-57f7-ac48-2d1cf99ad088
                        productor_id: cd3b83ce-114a-5624-bde0-0c482a535db2
                        nombre: Novillos cebados de septiembre
                        cantidad_animales: 30
                        peso_promedio_kg: 452.0
                        peso_total_kg: 13560.0
                        categoria: novillo_gordo
                        raza: Brahman comercial
                        finca: Finca La Esperanza
                        municipio_origen: Yopal
                        estado: simulado
                        creado_en: "2026-09-14T07:30:00-05:00"
                        actualizado_en: "2026-09-14T07:30:00-05:00"
                    pagina: 1
                    por_pagina: 20
                    total: 1
                vacio:
                  summary: Sin lotes que coincidan con el filtro
                  value:
                    datos: []
                    pagina: 1
                    por_pagina: 20
                    total: 0
        "400": { $ref: "#/components/responses/PeticionInvalida" }
    post:
      tags: [Lotes]
      operationId: crearLote
      summary: Registra un lote ganadero
      description: El servidor calcula `peso_total_kg` y asigna `estado = disponible`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoteEntrada" }
            example:
              productor_id: cd3b83ce-114a-5624-bde0-0c482a535db2
              nombre: Novillos cebados de septiembre
              cantidad_animales: 30
              peso_promedio_kg: 452.0
              categoria: novillo_gordo
              raza: Brahman comercial
              finca: Finca La Esperanza
              municipio_origen: Yopal
      responses:
        "201":
          description: Lote creado
          headers:
            Location: { $ref: "#/components/headers/Location" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Lote" }
              examples:
                creado: { $ref: "#/components/examples/LoteNovillosNuevo" }
        "400": { $ref: "#/components/responses/PeticionInvalida" }
        "422":
          description: Algún campo no cumple las reglas del lote
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                codigo: VALIDACION_FALLIDA
                mensaje: El lote tiene campos con valores no permitidos.
                detalles:
                  - campo: cantidad_animales
                    problema: Debe ser un entero entre 1 y 200.
                  - campo: peso_promedio_kg
                    problema: Debe estar entre 80 y 900 kg.

  /lotes/{lote_id}:
    parameters:
      - $ref: "#/components/parameters/LoteId"
    get:
      tags: [Lotes]
      operationId: obtenerLote
      summary: Obtiene un lote
      responses:
        "200":
          description: Lote encontrado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Lote" }
              examples:
                lote: { $ref: "#/components/examples/LoteNovillos" }
        "400": { $ref: "#/components/responses/PeticionInvalida" }
        "404": { $ref: "#/components/responses/NoEncontrado" }
    patch:
      tags: [Lotes]
      operationId: actualizarLote
      summary: Modifica uno o varios campos de un lote
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoteCambios" }
            example:
              cantidad_animales: 28
              peso_promedio_kg: 458.0
      responses:
        "200":
          description: Lote actualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Lote" }
              example:
                id: 9bad2b17-c8e0-57f7-ac48-2d1cf99ad088
                productor_id: cd3b83ce-114a-5624-bde0-0c482a535db2
                nombre: Novillos cebados de septiembre
                cantidad_animales: 28
                peso_promedio_kg: 458.0
                peso_total_kg: 12824.0
                categoria: novillo_gordo
                raza: Brahman comercial
                finca: Finca La Esperanza
                municipio_origen: Yopal
                estado: simulado
                creado_en: "2026-09-14T07:30:00-05:00"
                actualizado_en: "2026-09-29T11:02:00-05:00"
        "400": { $ref: "#/components/responses/PeticionInvalida" }
        "404": { $ref: "#/components/responses/NoEncontrado" }
        "422": { $ref: "#/components/responses/ValidacionFallida" }
    delete:
      tags: [Lotes]
      operationId: eliminarLote
      summary: Elimina un lote que aún no tiene simulaciones
      responses:
        "204":
          description: Lote eliminado
        "404": { $ref: "#/components/responses/NoEncontrado" }
        "409":
          description: El lote tiene simulaciones asociadas y no se puede eliminar
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                codigo: CONFLICTO
                mensaje: El lote tiene 2 simulaciones guardadas. Márquelo como vendido en lugar de eliminarlo.
                detalles: []

  /destinos:
    get:
      tags: [Destinos]
      operationId: listarDestinos
      summary: Lista los destinos de comercialización
      description: |
        Admite un filtro espacial: si se envían `cerca_lat`, `cerca_lon` y `radio_km`, solo devuelve
        destinos dentro de ese radio (en la Entrega 3 se resuelve con `ST_DWithin` de PostGIS).
      parameters:
        - $ref: "#/components/parameters/Pagina"
        - $ref: "#/components/parameters/PorPagina"
        - name: tipo
          in: query
          schema: { $ref: "#/components/schemas/TipoDestino" }
        - name: departamento
          in: query
          schema: { type: string, maxLength: 60 }
          example: Casanare
        - name: activo
          in: query
          schema: { type: boolean, default: true }
        - name: cerca_lat
          in: query
          schema: { type: number, minimum: -4.3, maximum: 13.5 }
          example: 5.3371
        - name: cerca_lon
          in: query
          schema: { type: number, minimum: -82, maximum: -66 }
          example: -72.3959
        - name: radio_km
          in: query
          schema: { type: number, exclusiveMinimum: 0, maximum: 1500 }
          example: 300
      responses:
        "200":
          description: Página de destinos
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListaDestinos" }
              example:
                datos:
                  - id: acca0ef8-f855-5505-b81b-25833e792ff1
                    nombre: Subasta Ganadera de Yopal
                    tipo: subasta
                    municipio: Yopal
                    departamento: Casanare
                    ubicacion: { type: Point, coordinates: [-72.4102, 5.3265] }
                    activo: true
                    creado_en: "2026-09-01T08:00:00-05:00"
                    actualizado_en: "2026-09-01T08:00:00-05:00"
                  - id: 52bbc2f4-901c-5ff0-a08a-5f8f08f91fa1
                    nombre: Frigorífico Guadalupe
                    tipo: frigorifico
                    municipio: Bogotá
                    departamento: Bogotá D.C.
                    ubicacion: { type: Point, coordinates: [-74.154, 4.587] }
                    activo: true
                    creado_en: "2026-09-01T08:00:00-05:00"
                    actualizado_en: "2026-09-01T08:00:00-05:00"
                pagina: 1
                por_pagina: 20
                total: 2
        "400": { $ref: "#/components/responses/PeticionInvalida" }
        "422":
          description: Filtro espacial incompleto
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                codigo: VALIDACION_FALLIDA
                mensaje: El filtro espacial requiere cerca_lat, cerca_lon y radio_km juntos.
                detalles:
                  - campo: radio_km
                    problema: Falta el parámetro.

  /destinos/{destino_id}:
    parameters:
      - $ref: "#/components/parameters/DestinoId"
    get:
      tags: [Destinos]
      operationId: obtenerDestino
      summary: Obtiene un destino
      responses:
        "200":
          description: Destino encontrado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Destino" }
              example:
                id: 52bbc2f4-901c-5ff0-a08a-5f8f08f91fa1
                nombre: Frigorífico Guadalupe
                tipo: frigorifico
                municipio: Bogotá
                departamento: Bogotá D.C.
                ubicacion: { type: Point, coordinates: [-74.154, 4.587] }
                activo: true
                creado_en: "2026-09-01T08:00:00-05:00"
                actualizado_en: "2026-09-01T08:00:00-05:00"
        "400": { $ref: "#/components/responses/PeticionInvalida" }
        "404": { $ref: "#/components/responses/NoEncontrado" }

  /destinos/{destino_id}/precios:
    parameters:
      - $ref: "#/components/parameters/DestinoId"
    get:
      tags: [Precios]
      operationId: listarPreciosDestino
      summary: Historial de precios por kilogramo de un destino
      parameters:
        - name: categoria
          in: query
          schema: { $ref: "#/components/schemas/Categoria" }
        - name: desde
          in: query
          schema: { type: string, format: date }
          example: "2026-09-01"
        - name: hasta
          in: query
          schema: { type: string, format: date }
          example: "2026-09-30"
      responses:
        "200":
          description: Precios del destino ordenados por fecha descendente
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PrecioMercado" }
              example:
                - id: d6f79498-451a-5491-a3a3-b42aa7a861ed
                  destino_id: 52bbc2f4-901c-5ff0-a08a-5f8f08f91fa1
                  categoria: novillo_gordo
                  precio_kg_cop: 11300
                  fecha: "2026-09-28"
                  fuente: Estimación del equipo con base en referencias públicas de precio de ganado gordo (valor ilustrativo)
                  creado_en: "2026-09-28T07:00:00-05:00"
                  actualizado_en: "2026-09-28T07:00:00-05:00"
                - id: 40e9a9da-5bdd-5d6c-93b6-0694c3d8800e
                  destino_id: 52bbc2f4-901c-5ff0-a08a-5f8f08f91fa1
                  categoria: vaca_gorda
                  precio_kg_cop: 9720
                  fecha: "2026-09-28"
                  fuente: Estimación del equipo con base en referencias públicas de precio de ganado gordo (valor ilustrativo)
                  creado_en: "2026-09-28T07:00:00-05:00"
                  actualizado_en: "2026-09-28T07:00:00-05:00"
        "400": { $ref: "#/components/responses/PeticionInvalida" }
        "404": { $ref: "#/components/responses/NoEncontrado" }
    post:
      tags: [Precios]
      operationId: registrarPrecio
      summary: Registra el precio del día para una categoría en el destino
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PrecioMercadoEntrada" }
            example:
              categoria: novillo_gordo
              precio_kg_cop: 11350
              fecha: "2026-09-29"
              fuente: Llamada telefónica al comprador del frigorífico
      responses:
        "201":
          description: Precio registrado
          headers:
            Location: { $ref: "#/components/headers/Location" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PrecioMercado" }
              example:
                id: 7a0d2c3e-2b8f-5f4e-8a61-3c9d0e1f2a44
                destino_id: 52bbc2f4-901c-5ff0-a08a-5f8f08f91fa1
                categoria: novillo_gordo
                precio_kg_cop: 11350
                fecha: "2026-09-29"
                fuente: Llamada telefónica al comprador del frigorífico
                creado_en: "2026-09-29T07:40:00-05:00"
                actualizado_en: "2026-09-29T07:40:00-05:00"
        "400": { $ref: "#/components/responses/PeticionInvalida" }
        "404": { $ref: "#/components/responses/NoEncontrado" }
        "409":
          description: Ya existe un precio para esa categoría, destino y fecha
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                codigo: CONFLICTO
                mensaje: Ya hay un precio de novillo_gordo para Frigorífico Guadalupe el 2026-09-29.
                detalles:
                  - campo: fecha
                    problema: Combinación destino + categoría + fecha repetida.
        "422": { $ref: "#/components/responses/ValidacionFallida" }

  /rutas:
    get:
      tags: [Rutas]
      operationId: listarRutas
      summary: Lista las rutas desde el origen, con su geometría
      parameters:
        - name: destino_id
          in: query
          schema: { type: string, format: uuid }
        - name: max_distancia_km
          in: query
          schema: { type: number, exclusiveMinimum: 0 }
          example: 400
      responses:
        "200":
          description: Rutas encontradas
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Ruta" }
              examples:
                villavicencio:
                  summary: Ruta Yopal → Villavicencio
                  value:
                    - id: 5ec2ea46-db9d-525b-8417-462de2b24a6a
                      destino_id: 6b8211cf-49f9-5354-925a-ec5edb230ee1
                      origen_nombre: Yopal (centro de acopio)
                      origen: { type: Point, coordinates: [-72.3959, 5.3371] }
                      distancia_km: 266.0
                      tiempo_horas: 5.1
                      peajes_cop: 85000
                      factor_dificultad: 1.1
                      merma_pct: 3.0
                      geometria:
                        type: LineString
                        coordinates: [[-72.3959, 5.3371], [-72.5471, 5.1731], [-72.8958, 4.8766], [-72.9281, 4.6094], [-72.9654, 4.5756], [-73.4868, 4.2699], [-73.6266, 4.142]]
                      fuente: manual
                      creado_en: "2026-09-01T08:00:00-05:00"
                      actualizado_en: "2026-09-26T10:15:00-05:00"
        "400": { $ref: "#/components/responses/PeticionInvalida" }

  /rutas/{ruta_id}:
    parameters:
      - name: ruta_id
        in: path
        required: true
        schema: { type: string, format: uuid }
        example: 5ec2ea46-db9d-525b-8417-462de2b24a6a
    get:
      tags: [Rutas]
      operationId: obtenerRuta
      summary: Obtiene una ruta con su geometría GeoJSON
      responses:
        "200":
          description: Ruta encontrada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ruta" }
              examples:
                villavicencio: { $ref: "#/components/examples/RutaVillavicencio" }
        "400": { $ref: "#/components/responses/PeticionInvalida" }
        "404": { $ref: "#/components/responses/NoEncontrado" }

  /simulaciones:
    get:
      tags: [Simulaciones]
      operationId: listarSimulaciones
      summary: Historial de simulaciones
      parameters:
        - $ref: "#/components/parameters/Pagina"
        - $ref: "#/components/parameters/PorPagina"
        - name: lote_id
          in: query
          schema: { type: string, format: uuid }
        - name: desde
          in: query
          schema: { type: string, format: date }
          example: "2026-09-01"
      responses:
        "200":
          description: Página de simulaciones, de la más reciente a la más antigua
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListaSimulaciones" }
              examples:
                conDatos:
                  summary: Una simulación de novillos con dos destinos
                  value:
                    datos:
                      - id: 5d2a9c1e-0b7f-5e3a-9c44-1f6e8d2a7b90
                        lote_id: 9bad2b17-c8e0-57f7-ac48-2d1cf99ad088
                        flete_km_cop: 6500
                        mejor_destino_id: 52bbc2f4-901c-5ff0-a08a-5f8f08f91fa1
                        creado_en: "2026-09-14T16:20:00-05:00"
                        actualizado_en: "2026-09-14T16:20:00-05:00"
                        resultados:
                          - id: 8e1f3a5b-7c9d-5e2f-a4b6-c8d0e2f4a6b8
                            simulacion_id: 5d2a9c1e-0b7f-5e3a-9c44-1f6e8d2a7b90
                            destino_id: 52bbc2f4-901c-5ff0-a08a-5f8f08f91fa1
                            ruta_id: a69ac042-f646-50e2-88bd-b4f76f38c169
                            distancia_km: 382.0
                            tiempo_horas: 8.4
                            merma_pct: 4.5
