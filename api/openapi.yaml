        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductorCambios" }
            example: { telefono: "3124587799" }
      responses:
        "200":
          description: Productor actualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Productor" }
        "400": { $ref: "#/components/responses/PeticionInvalida" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/Prohibido" }
        "404": { $ref: "#/components/responses/NoEncontrado" }
        "409": { $ref: "#/components/responses/Conflicto" }
        "422": { $ref: "#/components/responses/ValidacionFallida" }
    delete:
      tags: [Productores]
