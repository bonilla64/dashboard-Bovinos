# Publica la carpeta web/ en GitHub Pages en cada push a main.
# Requisito único: Settings → Pages → Build and deployment → Source: "GitHub Actions".
# (GitHub Pages por rama solo permite / o /docs, no /web; por eso se usa este workflow.)
name: Publicar prototipo en GitHub Pages

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: despliegue
        uses: actions/deploy-pages@v4
