# Levanta todo el proyecto con un solo comando:  docker compose up --build
#   db  → PostgreSQL 16 con PostGIS 3
#   api → API REST (http://localhost:3000, documentación en http://localhost:3000/docs)
#   web → prototipo del tablero (http://localhost:8080)
# Las credenciales salen del archivo .env (copie .env.example). Nada secreto está escrito aquí.

services:
  db:
    image: postgis/postgis:16-3.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Defina POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:-simulador_ganadero}
    volumes:
      - datos_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-simulador_ganadero}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET en .env (mínimo 32 caracteres)}
      CONTRASENA_DEMO: ${CONTRASENA_DEMO:-}
      CORS_ORIGEN: ${CORS_ORIGEN:-http://localhost:8080,http://127.0.0.1:8080}
      PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      OSRM_BASE_URL: ${OSRM_BASE_URL-https://router.project-osrm.org}
      PRECIO_DIAS_ADVERTENCIA: ${PRECIO_DIAS_ADVERTENCIA:-7}
      PRECIO_DIAS_MAXIMO: ${PRECIO_DIAS_MAXIMO:-30}
    ports:
      - "${API_PUERTO:-3000}:3000"

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./web:/usr/share/nginx/html:ro
    ports:
      - "${WEB_PUERTO:-8080}:80"

volumes:
  datos_postgres:
